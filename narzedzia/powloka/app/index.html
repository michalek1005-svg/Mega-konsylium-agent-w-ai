<!doctype html>
<html lang="pl" data-motyw="jasny">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; frame-src file:">
<title>MS Konsylium</title>
<style>
/*@@FONT@@*/
/*@@MS-TOKENY@@*/
/* Powłoka w układzie Nawigatora Medycznego: jedna szklana tafla (rounded 44px, .neumorphic-panel-shadow)
   na scenie „Laguna” z ziarnem, pionowy pasek okrągłych ikon (components/left-nav-bar.tsx: otwarty moduł =
   przycisk wciśnięty, bez koloru akcentu), logo-litera w stylu neonowego N (lib/logo-n.ts). */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 'Plus Jakarta Sans Variable', 'Segoe UI', system-ui, sans-serif; color: var(--ink); overflow: hidden;
  background: var(--scene); background-color: var(--bg-viewport); display: grid; place-items: center; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: var(--grain); opacity: .16; mix-blend-mode: soft-light; }
html[data-motyw="ciemny"] body::after { opacity: .08; }
.tafla-glowna { position: relative; width: calc(100vw - 48px); height: calc(100vh - 48px); max-width: 1680px; border-radius: 44px; overflow: hidden;
  background: var(--tafla); box-shadow: var(--tafla-cien); backdrop-filter: blur(26px) saturate(140%); }
/* logo K jak neonowe N Nawigatora */
.logo-k { position: absolute; left: 23px; top: 12px; width: 60px; height: 60px; z-index: 100; display: grid; place-items: center; }
.logo-k svg { width: 48px; height: 51px; filter: contrast(1.2) drop-shadow(0 1px 2px rgba(10,54,52,.4)); }
/* pasek boczny */
nav.pasek { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); z-index: 100; display: flex; flex-direction: column; gap: 6px; padding: 8px;
  border-radius: 24px; background: var(--wcisk-tlo); backdrop-filter: blur(12px); border: 1px solid var(--nav-obrys);
  box-shadow: 8px 8px 16px var(--wcisk-cien), -8px -8px 16px var(--wcisk-swiatlo); }
nav.pasek button { all: unset; position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--mut);
  transition: background-color .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s cubic-bezier(.2,.8,.2,1), color .22s; }
nav.pasek button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .22s; }
nav.pasek button[aria-current="page"], nav.pasek button[aria-pressed="true"], nav.pasek button:focus-visible, nav.pasek button:active {
  background-color: var(--wcisk-on-tlo); box-shadow: var(--wcisk-on-cien); color: var(--ink); outline: none; }
html[data-motyw="ciemny"] nav.pasek button[aria-current="page"], html[data-motyw="ciemny"] nav.pasek button[aria-pressed="true"] { color: #fff; }
nav.pasek button:active svg { transform: scale(.92); }
nav.pasek .kreska { height: 1px; margin: 4px 8px; background: var(--nav-obrys); }
.podpis { position: absolute; left: calc(100% + 14px); top: 50%; transform: translate(-6px, -50%); white-space: nowrap; padding: 6px 11px; border-radius: 12px;
  background: var(--panel); box-shadow: var(--panel-cien); backdrop-filter: blur(14px); color: var(--ink); font-size: 12px; font-weight: 650; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
.podpis small { display: block; font-weight: 500; color: var(--mut); font-size: 11px; }
nav.pasek button:hover .podpis, nav.pasek button:focus-visible .podpis { opacity: 1; transform: translate(0, -50%); }
/* moduły */
main { position: absolute; inset: 10px 14px 10px 88px; min-width: 0; border-radius: 0 34px 34px 0; overflow: hidden; }
iframe { border: 0; width: 100%; height: 100%; display: block; background: transparent; position: absolute; inset: 0; }
.brak { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--mut); padding: 40px; }
/* stan na dole i okienko folderu */
.stan { position: absolute; left: 22px; bottom: 16px; z-index: 100; font-size: 11px; color: var(--mut); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px; text-align: center; }
.stan .offline { color: var(--petrol); font-weight: 750; display: flex; align-items: center; gap: 5px; }
.stan .offline::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3fbf8a; box-shadow: 0 0 0 3px rgba(63,191,138,.2); }
.folder { position: absolute; left: 92px; top: 50%; transform: translateY(-10%); z-index: 120; width: 320px; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 20px;
  background: var(--tafla); box-shadow: var(--tafla-cien); backdrop-filter: blur(26px) saturate(140%); font-size: 12.5px; color: var(--mut); }
.folder b { color: var(--ink); font-size: 13px; }
.folder code { font: 11.5px ui-monospace, Consolas, monospace; color: var(--ink); word-break: break-all; }
.folder .rzad { display: flex; gap: 6px; flex-wrap: wrap; }
.folder .brak-f { color: var(--alarm); }
.folder .uwaga { font-size: 11.5px; }
</style>
</head>
<body>
<div class="tafla-glowna">
  <div class="logo-k" title="Konsylium AI · marka MS" aria-label="Konsylium AI">
    <svg viewBox="0 0 186 198" aria-hidden="true"><defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f9f8"/><stop offset="1" stop-color="#b8c3c1"/></linearGradient></defs>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M56 38V160M138 40L74 102M86 92L142 158" stroke="url(#neon)" stroke-width="27"/>
      <path d="M56 38V160M138 40L74 102M86 92L142 158" stroke="#fff" stroke-width="3.2"/></g></svg>
  </div>
  <nav class="pasek" aria-label="Moduły">
    <button class="modul" type="button" data-modul="wywiad" aria-label="Wywiad z pacjentem"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg><span class="podpis">Wywiad z pacjentem<small>opis, pytania od AI na żywo</small></span></button>
    <button class="modul" type="button" data-modul="anonimizator" aria-label="Anonimizator badań"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg><span class="podpis">Anonimizator badań<small>wyniki bez danych osobowych</small></span></button>
    <button class="modul" type="button" data-modul="pokoj" aria-label="Pokój lekarski"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="podpis">Pokój lekarski<small>konsylium na żywo i wnioski</small></span></button>
    <div class="kreska"></div>
    <button type="button" id="folder-przycisk" aria-label="Folder Konsylium" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="podpis">Folder Konsylium<small id="folder-podpis">nie wybrano</small></span></button>
    <button type="button" id="motyw" aria-label="Motyw jasny / ciemny"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span class="podpis">Motyw jasny / ciemny</span></button>
  </nav>
  <div class="folder" id="folder-panel" hidden>
    <b>Folder Konsylium</b>
    <span id="folder-sciezka">Nie wybrano.</span>
    <span class="uwaga">Tu AI czyta zanonimizowane odpowiedzi i zapisuje pytania, a konsylium dymki i wnioski. Sieć jest zablokowana; dane zostają na tym komputerze.</span>
    <div class="rzad"><button class="nk-button nk-on" type="button" id="folder-wybierz">Wybierz folder…</button>
    <button class="nk-button" type="button" id="folder-otworz" hidden>Otwórz</button></div>
  </div>
  <main>
    <div class="brak" id="brak" hidden>Ten moduł nie jest jeszcze dołączony do tej wersji aplikacji.</div>
  </main>
  <div class="stan"><span class="offline">Offline</span><span id="wersja"></span></div>
</div>
<!--KONFIGURACJA-->
<script>
(function () {
  'use strict';
  var MODULY = { wywiad: 'moduly/wywiad.html', anonimizator: 'moduly/anonimizator.html', pokoj: 'moduly/pokoj.html' };
  var NAZWY = { wywiad: 'Wywiad z pacjentem', anonimizator: 'Anonimizator badań', pokoj: 'Pokój lekarski' };
  var main = document.querySelector('main'), brak = document.getElementById('brak');
  var dostepne = window.MS_MODULY || {};
  var P = window.msPowloka || null; // most do plików (preload.js); brak = podgląd poza Electronem
  // Każdy moduł ma własną ramkę, ładowaną przy pierwszym otwarciu i potem tylko ukrywaną,
  // żeby przejście „wywiad → anonimizator → wywiad” nie gubiło stanu.
  var ramki = {}, gotowe = {}, kolejka = {}, biezacy = null;
  function ramka(id) {
    if (ramki[id]) return ramki[id];
    var f = document.createElement('iframe');
    f.title = NAZWY[id]; f.setAttribute('allow', 'clipboard-write *'); f.hidden = true; f.dataset.modul = id;
    f.addEventListener('load', function () {
      gotowe[id] = true;
      wyslijMotyw(f);
      (kolejka[id] || []).forEach(function (m) { f.contentWindow.postMessage(m, '*'); });
      kolejka[id] = [];
    });
    f.src = MODULY[id];
    main.insertBefore(f, brak);
    ramki[id] = f;
    return f;
  }
  function doModulu(id, wiad) {
    if (!MODULY[id] || dostepne[id] === false) return false;
    var f = ramka(id);
    if (gotowe[id]) f.contentWindow.postMessage(wiad, '*');
    else (kolejka[id] = kolejka[id] || []).push(wiad);
    return true;
  }
  function pokaz(id) {
    if (!MODULY[id]) id = 'wywiad';
    biezacy = id; if (typeof pokazPanelFolderu === 'function') pokazPanelFolderu(false);
    document.querySelectorAll('button.modul').forEach(function (b) {
      if (b.dataset.modul === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    Object.keys(ramki).forEach(function (k) { ramki[k].hidden = k !== id; });
    if (dostepne[id] === false) { brak.hidden = false; return; }
    brak.hidden = true;
    ramka(id).hidden = false;
    try { localStorage.setItem('ms-modul', id); } catch (e) {}
  }
  document.querySelectorAll('button.modul').forEach(function (b) { b.addEventListener('click', function () { pokaz(b.dataset.modul); }); });

  // Prośby modułów (narzedzia/wspolne/ms-most.js). Odpowiadamy tylko naszym ramkom.
  function modulZrodla(src) {
    for (var k in ramki) if (ramki[k].contentWindow === src) return k;
    return null;
  }
  var OPERACJE = {
    ping: function () { return 'ms-powloka-1'; },
    folder: function () { return P ? P.folder() : null; },
    wybierzFolder: function () { return P ? P.wybierzFolder().then(function (f) { pokazFolder(f); return f; }) : null; },
    czytaj: function (a) { return P.czytaj(a[0]); },
    zapisz: function (a) { return P.zapisz(a[0], a[1]); },
    lista: function (a) { return P.lista(a[0]); },
    czytajFolder: function (a) { return P.czytajFolder(a[0]); },
    otworzModul: function (a) { pokaz(a[0]); return true; },
    wyslij: function (a, od) { return doModulu(a[0], { typ: 'ms-dane', od: od, dane: a[1] }); }
  };
  window.addEventListener('message', function (e) {
    var d = e.data, od = modulZrodla(e.source);
    if (!d || d.typ !== 'ms-most' || !od) return;
    var odp = function (wynik, blad) { e.source.postMessage({ typ: 'ms-most-odp', id: d.id, wynik: wynik, blad: blad }, '*'); };
    var op = OPERACJE[d.op];
    if (!op) { odp(null, 'Nieznana operacja.'); return; }
    if (!P && ['czytaj', 'zapisz', 'lista', 'czytajFolder'].indexOf(d.op) !== -1) { odp(null, 'Pliki działają tylko w aplikacji Windows.'); return; }
    Promise.resolve().then(function () { return op(d.args || [], od); }).then(function (w) { odp(w === undefined ? null : w); }, function (err) {
      odp(null, String(err && err.message || err).replace(/^Error invoking remote method '[^']+': (Error: )?/, ''));
    });
  });

  // Folder Konsylium
  var $fs = document.getElementById('folder-sciezka'), $fo = document.getElementById('folder-otworz'), $fw = document.getElementById('folder-wybierz');
  function pokazFolder(f) {
    var $fp = document.getElementById('folder-podpis');
    if (f) { $fs.innerHTML = ''; $fs.className = ''; var c = document.createElement('code'); c.textContent = f; $fs.appendChild(c); $fw.textContent = 'Zmień…'; $fp.textContent = f.split(/[\\/]/).filter(Boolean).pop(); }
    else { $fs.textContent = 'Nie wybrano. Wybierz kopię repo Konsylium, żeby AI mogło prowadzić wywiad i konsylium na żywo.'; $fs.className = 'brak-f'; $fw.textContent = 'Wybierz folder…'; $fp.textContent = 'nie wybrano'; }
    $fo.hidden = !f;
  }
  var $fpan = document.getElementById('folder-panel'), $fb = document.getElementById('folder-przycisk');
  function pokazPanelFolderu(t) { $fpan.hidden = !t; $fb.setAttribute('aria-pressed', String(!!t)); }
  $fb.addEventListener('click', function () { pokazPanelFolderu($fpan.hidden); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') pokazPanelFolderu(false); });
  if (P) {
    P.folder().then(function (f) { pokazFolder(f); if (!f) pokazPanelFolderu(true); });
    $fw.addEventListener('click', function () { P.wybierzFolder().then(function (f) { pokazFolder(f); Object.keys(ramki).forEach(function (k) { doModulu(k, { typ: 'ms-dane', od: 'powloka', dane: { folder: f } }); }); }); });
    $fo.addEventListener('click', function () { P.otworzFolder(); });
  } else $fb.hidden = true;

  var start = 'wywiad';
  try { start = localStorage.getItem('ms-modul') || 'wywiad'; } catch (e) {}
  pokaz(start);
  // Motyw jak w Nawigatorze; zapamiętany i przekazywany do modułów
  function wyslijMotyw(f) { try { f.contentWindow.postMessage({ typ: 'ms-motyw', motyw: document.documentElement.dataset.motyw }, '*'); } catch (e) {} }
  function ustawMotyw(m) {
    document.documentElement.dataset.motyw = m;
    try { localStorage.setItem('ms-motyw-2', m); } catch (e) {}
    Object.keys(ramki).forEach(function (k) { wyslijMotyw(ramki[k]); });
  }
  var motyw = 'jasny';
  try { motyw = localStorage.getItem('ms-motyw-2') || 'jasny'; } catch (e) {}
  document.documentElement.dataset.motyw = motyw;
  document.getElementById('motyw').addEventListener('click', function () {
    ustawMotyw(document.documentElement.dataset.motyw === 'ciemny' ? 'jasny' : 'ciemny');
  });
  document.getElementById('wersja').textContent = (window.MS_WERSJA || 'dev');
})();
</script>
</body>
</html>
