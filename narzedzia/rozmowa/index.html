<!doctype html>
<html lang="pl" data-motyw="jasny">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Rozmowa</title>
<meta name="description" content="Rozmowa z jednym terapeutą AI, za którym pracuje zespół agentów różnych podejść. Okno jak w komunikatorze. Narzędzie testowe marki MS.">
<link rel="stylesheet" href="../wspolne/ms-tokeny.css">
<style>
/*@@FONT@@*/
/*@@MS-TOKENY@@*/
/* Rozmowa (brat psychologiczny MS Konsylium, Michał 1.11.2026): okno komunikatora. Jeden głos „Terapeuta MS”,
   pasek „zespół pracuje” pokazuje, które podejścia przygotowują odpowiedź. Paleta lawendowa (wątek Graficzny). */
:root { --law: #8A7FB5; --law-2: #5B4A8A; --law-tlo: rgba(138,127,181,.14); --szalwia: #9FBF9A; --piasek: #F0CFA6; --roz: #D99A8C; --blekit: #8FB6C9;
  --dymek-ja: #DDE9F0; --dymek-on: #ffffff; --ryzyko: #A83A38; --ryzyko-tlo: #fbe9e7; }
html[data-motyw="ciemny"] { --law-tlo: rgba(138,127,181,.22); --dymek-ja: #2b3a44; --dymek-on: #262233; --ryzyko-tlo: #3a1d1b; --ryzyko: #ff9a8c; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 14.5px/1.5 'Plus Jakarta Sans Variable', 'Segoe UI', system-ui, sans-serif; color: var(--ink); background: var(--scene); background-color: var(--bg-viewport); }
html.osadzony body { background: transparent; }
.uklad { height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 980px; margin: 0 auto; padding: 14px 16px; gap: 10px; }
html.osadzony .uklad { padding: 10px 14px; }
/* nagłówek jak w komunikatorze */
.glowa { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 22px; background: var(--panel); box-shadow: var(--panel-cien); }
.awatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--law), var(--law-2)); position: relative; flex: none; }
.awatar::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #3fbf8a; border: 2px solid var(--panel); }
.awatar.pracuje::after { background: var(--piasek); animation: puls 1.1s ease-in-out infinite; }
@keyframes puls { 50% { transform: scale(.6); opacity: .6; } }
.kto { min-width: 0; flex: 1; }
.kto b { display: block; font-size: 15px; }
.kto span { display: block; font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zespol { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.zespol i { font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--law-tlo); color: var(--law-2); }
html[data-motyw="ciemny"] .zespol i { color: #cdbfee; }
.zespol i.straznik { background: rgba(168,58,56,.12); color: var(--ryzyko); }
.narzedzia { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.nk-button.mala { min-height: 32px; padding: 5px 11px; font-size: 12.5px; }
.przel { display: inline-flex; border-radius: 16px; background: var(--btn); padding: 2px; }
.przel button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--btn-txt); }
.przel button[aria-pressed="true"] { background: var(--on); color: var(--on-txt); }
/* okno rozmowy */
.okno { position: relative; border-radius: 26px; background: var(--tafla); box-shadow: var(--tafla-cien); overflow: hidden; display: grid; grid-template-rows: 1fr; min-height: 0; }
.lista { overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.dzien { align-self: center; font-size: 11px; color: var(--mut); background: var(--panel); padding: 3px 10px; border-radius: 10px; margin: 4px 0; }
.wiad { max-width: 78%; display: flex; flex-direction: column; gap: 4px; animation: wejscie .28s ease-out; }
@keyframes wejscie { from { opacity: 0; transform: translateY(8px); } }
.wiad.ja { align-self: flex-end; align-items: flex-end; }
.wiad.on { align-self: flex-start; }
.babel { padding: 10px 14px; border-radius: 18px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 6px 18px -14px rgba(10,20,40,.5); }
.ja .babel { background: var(--dymek-ja); border-bottom-right-radius: 6px; }
.on .babel { background: var(--dymek-on); border-bottom-left-radius: 6px; border: 1px solid rgba(138,127,181,.18); }
.on.ryzyko .babel { background: var(--ryzyko-tlo); border-color: var(--ryzyko); }
.meta { font-size: 11px; color: var(--mut); display: flex; gap: 8px; align-items: center; padding: 0 6px; }
.meta .role { display: inline-flex; gap: 3px; }
.meta .role i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; }
.meta button { all: unset; cursor: pointer; color: var(--law-2); font-weight: 700; }
html[data-motyw="ciemny"] .meta button { color: #cdbfee; }
.mysli { font-size: 12.5px; padding: 8px 12px; border-radius: 14px; background: var(--panel); box-shadow: var(--panel-cien); display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
.mysli div { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
.mysli b { color: var(--law-2); font-weight: 750; }
html[data-motyw="ciemny"] .mysli b { color: #cdbfee; }
.mysli .spor { border-top: 1px solid rgba(138,127,181,.25); padding-top: 6px; color: var(--mut); }
.pisze { align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: var(--dymek-on); border: 1px solid rgba(138,127,181,.18); color: var(--mut); font-size: 12.5px; }
.pisze .kropki i { display: inline-block; width: 7px; height: 7px; margin: 0 1.5px; border-radius: 50%; background: var(--law); animation: kropka 1.2s infinite; }
.pisze .kropki i:nth-child(2) { animation-delay: .2s; } .pisze .kropki i:nth-child(3) { animation-delay: .4s; }
@keyframes kropka { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
/* pomoc / ryzyko */
.pomoc { margin: 0 18px 8px; padding: 10px 14px; border-radius: 16px; background: var(--ryzyko-tlo); color: var(--ink); border: 1.5px solid var(--ryzyko); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.pomoc b { color: var(--ryzyko); }
.pomoc .nr { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.pomoc .nr span { font-weight: 800; font-size: 15px; }
/* start */
.start { padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; max-width: 640px; margin: auto; text-align: center; }
.start h2 { margin: 0; font-size: 22px; }
.start p { margin: 0; color: var(--mut); }
.start .info { text-align: left; font-size: 13px; padding: 12px 14px; border-radius: 16px; background: var(--law-tlo); color: var(--ink); }
.start .przyklady { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.start .przyklady button { all: unset; cursor: pointer; text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--panel); box-shadow: var(--panel-cien); font-size: 13px; }
.start .przyklady button:hover { background: var(--btn-h); }
/* kompozytor */
.pisz { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 24px; background: var(--panel); box-shadow: var(--panel-cien); }
.rzad { display: flex; gap: 8px; align-items: flex-end; }
.pisz textarea { flex: 1; resize: none; border: 1px solid var(--pole-obrys); background: var(--pole); color: var(--ink); border-radius: 18px; padding: 10px 14px; font: inherit; max-height: 140px; min-height: 42px; outline: none; }
.pisz textarea:focus { border-color: var(--law); box-shadow: 0 0 0 3px var(--law-tlo); }
.emoji-btn { all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; background: var(--btn); }
.wyslij { all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--law), var(--law-2)); color: #fff; flex: none; }
.wyslij:disabled { opacity: .4; cursor: default; }
.wyslij svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.emoji { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 6px; }
.emoji button { all: unset; cursor: pointer; font-size: 20px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.emoji button:hover { background: var(--btn-h); }
.stopka { font-size: 11.5px; color: var(--mut); text-align: center; margin: 0; padding: 0 10px; }
.blad { color: var(--alarm); font-size: 12px; }
@media (max-width: 640px) { .wiad { max-width: 92%; } .narzedzia .tekst-przycisku { display: none; } }
</style>
</head>
<body>
<div class="uklad">
  <header class="glowa">
    <div class="awatar" id="awatar" aria-hidden="true">T</div>
    <div class="kto"><b>Terapeuta MS</b><span id="stan">Jeden głos, za którym pracuje zespół podejść terapeutycznych</span>
      <div class="zespol" id="zespol" aria-live="polite"></div></div>
    <div class="narzedzia">
      <div class="przel" role="group" aria-label="Dla kogo pisze zespół" title="Dla kogo ma być napisana odpowiedź">
        <button type="button" id="odb-terapeuta" aria-pressed="true">dla terapeuty</button><button type="button" id="odb-klient" aria-pressed="false">do klienta</button>
      </div>
      <button class="nk-button mala" type="button" id="konsylium" title="Przekazuje całą rozmowę do pełnego konsylium w Pokoju psychologicznym">Zwołaj konsylium</button>
      <button class="nk-button mala" type="button" id="nowa" title="Zaczyna nową, czystą rozmowę">Nowa rozmowa</button>
    </div>
  </header>

  <section class="okno" aria-label="Rozmowa">
    <div class="lista" id="lista"></div>
    <div class="pomoc" id="pomoc" hidden role="alert"></div>
  </section>

  <form class="pisz" id="pisz" autocomplete="off">
    <div class="emoji" id="emoji" hidden></div>
    <div class="rzad">
      <button class="emoji-btn" type="button" id="emoji-btn" aria-label="Emotikony" title="Emotikony">🙂</button>
      <textarea id="tekst" rows="1" placeholder="Opisz konkretną sytuację… (Enter wysyła, Shift+Enter nowa linia)" maxlength="3000" aria-label="Twoja wiadomość"></textarea>
      <button class="wyslij" type="submit" id="wyslij" aria-label="Wyślij"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
    </div>
    <span class="blad" id="blad" role="alert"></span>
    <p class="stopka">To nie jest terapia. Narzędzie testowe i edukacyjne marki MS; nie służy do diagnozy ani terapii realnych osób. W zagrożeniu życia dzwoń pod 112.</p>
  </form>
</div>
<script src="../wspolne/ms-most.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  // Numery pomocy: kopia config/pomoc-pl.yaml (jedyne źródło; aktualizować razem z plikiem)
  var POMOC = [['112', 'zagrożenie życia'], ['800 70 2222', 'kryzys psychiczny, całodobowo'], ['116 123', 'telefon zaufania dla dorosłych'], ['800 120 002', 'przemoc domowa, „Niebieska Linia”']];
  var ROLE = { prowadzacy: ['Prowadzący', '#5B4A8A'], cbt: ['CBT', '#3f7fa8'], psychodynamiczny: ['Psychodynamiczny', '#8a5f34'], systemowy: ['Systemowy', '#6a8f5a'],
    act: ['Trzecia fala (ACT)', '#2f8f86'], humanistyczny: ['Humanistyczny', '#c0894a'], diagnosta: ['Diagnosta', '#5a5890'], psychiatra: ['Psychiatra', '#a84a5c'],
    straznik: ['Strażnik ryzyka', '#A83A38'], straznik_ryzyka: ['Strażnik ryzyka', '#A83A38'], klient_sedzia: ['Klient-sędzia', '#7a7a7a'] };
  var EMOJI = ['🙂', '😊', '😔', '😢', '😟', '😰', '😤', '😡', '😴', '🤔', '😮‍💨', '🙏', '❤️', '💔', '👍', '👎', '🤝', '🌱', '☀️', '🌧️', '🏠', '💼', '👨‍👩‍👧', '🧠', '💬', '⏳', '✅', '❓'];
  // Filtr słownikowy fraz wysokiego ryzyka (docs/BEZPIECZENSTWO.md §3): deterministyczny, po polsku, bez znaków diakrytycznych
  var FRAZY = ['zabic sie', 'zabije sie', 'zabilbym sie', 'zabilabym sie', 'nie chce zyc', 'nie chce juz zyc', 'nie chce dalej zyc', 'skonczyc ze soba', 'skoncze ze soba',
    'odebrac sobie zycie', 'odbiore sobie zycie', 'pozegnac sie z', 'pozegnalem sie', 'pozegnalam sie', 'wezme wszystkie tabletki', 'wszystkie tabletki', 'ile tabletek', 'ile trzeba tabletek',
    'mam plan', 'zrobie mu krzywde', 'zrobie jej krzywde', 'zrobie im krzywde', 'glosy kaza', 'glosy mowia', 'lepiej byloby nie zyc', 'lepiej by bylo nie zyc', 'nie chce sie budzic', 'nie chce sie obudzic',
    'chce umrzec', 'chcialabym umrzec', 'chcialbym umrzec', 'podciac sobie', 'podetne sobie', 'powiesic sie', 'powiesze sie', 'rzucic sie pod', 'rzuce sie', 'skoczyc z', 'skocze z',
    'beze mnie byloby latwiej', 'beze mnie byloby lepiej', 'byloby lepiej beze mnie', 'wszystkim byloby lepiej beze mnie', 'zrobie sobie krzywde', 'zrobic sobie krzywde', 'sie okaleczam', 'tne sie',
    'zabije go', 'zabije ja', 'grozi mi', 'mnie bije', 'mnie pobil', 'mnie pobila', 'boje sie wracac do domu'];
  var norm = function (t) { return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/\s+/g, ' '); };
  function filtr(t) { var n = norm(t), out = []; FRAZY.forEach(function (f) { if (n.indexOf(f) >= 0) out.push(f); }); return out; }

  var Z = { dostepny: false, kod: null, numer: 0, odbiorca: 'terapeuta', wiad: [], widoczne: 0, timer: null, panelTimer: null, czekam: false, demo: false };
  var $lista = $('lista'), $tekst = $('tekst'), $wyslij = $('wyslij'), $zespol = $('zespol'), $stan = $('stan'), $pomoc = $('pomoc'), $blad = $('blad'), $awatar = $('awatar');

  function kodRozmowy() { var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = ''; for (var i = 0; i < 6; i++) { s += A[Math.floor(Math.random() * A.length)]; if (i === 2) s += '-'; } return 'R' + s; }
  var sciezka = function (p) { return 'rozmowa/' + Z.kod + '/' + p; };

  // ── widok ──
  function hhmm(ts) { try { return new Date(ts).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function rolaChip(r) { var d = ROLE[r] || [r, '#777']; return '<i title="' + esc(d[0]) + '" style="background:' + d[1] + '">' + esc(d[0].replace(/[^A-ZĄĆĘŁŃÓŚŹŻ]/g, '').slice(0, 2) || d[0].slice(0, 2).toUpperCase()) + '</i>'; }
  function ekranStartowy() {
    $lista.innerHTML = '<div class="start"><div class="awatar" style="width:64px;height:64px;font-size:26px;margin:0 auto">T</div>' +
      '<h2>Porozmawiajmy o konkretnej sytuacji</h2><p>Napisz, co się dzieje – jak do znajomego terapeuty. Odpowiada jeden głos, ale nad każdą odpowiedzią pracuje zespół: różne podejścia terapeutyczne, diagnosta, psychiatra i strażnik ryzyka. Zobaczysz, kto właśnie pracuje.</p>' +
      '<div class="info"><b>To nie jest terapia.</b> To narzędzie testowe i edukacyjne marki MS dla psychologa; nie stawia rozpoznań i nie zastępuje kontaktu z człowiekiem. Rozmowa dotyczy dorosłych; piszemy o osobach tylko wiekiem i płcią, bez nazwisk. W zagrożeniu życia dzwoń pod 112.</div>' +
      '<div class="przyklady">' + [
        'Klientka 34 l. od dwóch miesięcy nie cieszy się niczym, budzi się o 4:00. Od czego zacząć pierwszą sesję?',
        'Mężczyzna 41 l. unika rozmów z szefem, nie śpi przed spotkaniami. Chce „coś z tym zrobić w tydzień”.',
        'Para po 10 latach: kłótnie o pieniądze, on się wycofuje, ona eskaluje. Terapia par czy indywidualna?',
        'Pacjent 58 l. po utracie pracy mówi, że „to już nie ma sensu”. Jak rozmawiać dalej?'
      ].map(function (t) { return '<button type="button" data-przyklad="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div></div>';
    $lista.querySelectorAll('[data-przyklad]').forEach(function (b) { b.addEventListener('click', function () { $tekst.value = b.dataset.przyklad; dopasuj(); $tekst.focus(); }); });
  }
  function dodajWiad(w, n) {
    var el = document.createElement('div');
    if (w.od === 'uzytkownik') {
      el.className = 'wiad ja';
      el.innerHTML = '<div class="babel">' + esc(w.polecenie === 'konsylium' ? '📋 Zwołuję pełne konsylium nad tą rozmową.' : w.tekst) + '</div><div class="meta"><span>' + hhmm(w.ts) + '</span></div>';
    } else {
      var ryz = Number(w.ryzyko) || 0;
      el.className = 'wiad on' + (ryz >= 3 || w.przerwanie ? ' ryzyko' : '');
      var role = (w.panel || []).map(rolaChip).join('');
      var tekst = w.tekst + (w.plan_bezpieczenstwa ? '\n\n🛟 Plan bezpieczeństwa:\n' + w.plan_bezpieczenstwa : '');
      el.innerHTML = '<div class="babel">' + esc(tekst) + '</div><div class="meta"><span>' + hhmm(w.ts) + '</span>' +
        (role ? '<span class="role" title="Kto pracował nad odpowiedzią">' + role + '</span>' : '') +
        (ryz ? '<span style="color:var(--ryzyko);font-weight:700">ryzyko ' + ryz + '</span>' : '') +
        (w.glosy && w.glosy.length ? '<button type="button" data-mysli="' + n + '">Kto co myślał</button>' : '') + '</div>';
      var m = document.createElement('div'); m.className = 'mysli'; m.hidden = true;
      m.innerHTML = (w.glosy || []).map(function (g) { var d = ROLE[g.rola] || [g.rola]; return '<div><b>' + esc(d[0]) + '</b><span>' + esc(g.skrot) + '</span></div>'; }).join('') +
        (w.spor ? '<div class="spor"><b>Spór</b><span>' + esc(w.spor) + '</span></div>' : '');
      el.appendChild(m);
      var b = el.querySelector('[data-mysli]'); if (b) b.addEventListener('click', function () { m.hidden = !m.hidden; b.textContent = m.hidden ? 'Kto co myślał' : 'Zwiń'; });
      if (ryz >= 3 || w.przerwanie) pokazPomoc('Zespół ocenił tę sytuację jako wymagającą kontaktu z człowiekiem teraz.');
    }
    $lista.appendChild(el);
  }
  var $pisze = null;
  function pokazPisze(role) {
    if (!$pisze) { $pisze = document.createElement('div'); $pisze.className = 'pisze'; }
    var kto = role && role.length ? role.map(function (r) { return (ROLE[r] || [r])[0]; }).join(', ') : 'zespół';
    $pisze.innerHTML = '<span class="kropki"><i></i><i></i><i></i></span><span>' + esc(kto) + ' – pisze…</span>';
    $lista.appendChild($pisze); przewin();
  }
  function ukryjPisze() { if ($pisze && $pisze.parentNode) $pisze.parentNode.removeChild($pisze); }
  function przewin() { $lista.scrollTop = $lista.scrollHeight; }
  function pokazZespol(role) {
    $zespol.innerHTML = role && role.length ? '<span style="font-size:11px;color:var(--mut)">zespół pracuje: ' + role.length + '</span>' + role.map(function (r) { var d = ROLE[r] || [r]; return '<i class="' + (r.indexOf('straznik') === 0 ? 'straznik' : '') + '">' + esc(d[0]) + '</i>'; }).join('') : '';
    $awatar.classList.toggle('pracuje', !!(role && role.length));
    $stan.textContent = role && role.length ? 'Zespół przygotowuje odpowiedź…' : (Z.kod ? 'Rozmowa ' + Z.kod + (Z.dostepny ? ' · zapis w folderze Konsylium' : ' · podgląd bez aplikacji') : 'Jeden głos, za którym pracuje zespół podejść terapeutycznych');
  }
  function pokazPomoc(powod) {
    $pomoc.hidden = false;
    $pomoc.innerHTML = '<b>Jeśli to dotyczy Ciebie albo kogoś obok – nie zostawaj z tym sam/sama.</b><span>' + esc(powod || '') + '</span><div class="nr">' + POMOC.map(function (p) { return '<span>' + p[0] + '</span> <small>' + esc(p[1]) + '</small>'; }).join('') + '</div>';
  }
  function odswiezWidok() {
    if (!Z.wiad.length) { ekranStartowy(); Z.widoczne = 0; return; }
    if (Z.widoczne === 0) $lista.innerHTML = '<div class="dzien">' + new Date(Z.wiad[0].ts).toLocaleDateString('pl-PL') + '</div>';
    for (var n = Z.widoczne; n < Z.wiad.length; n++) dodajWiad(Z.wiad[n], n);
    Z.widoczne = Z.wiad.length;
    var ost = Z.wiad[Z.wiad.length - 1];
    Z.czekam = ost.od === 'uzytkownik';
    if (Z.czekam) pokazPisze(Z.panel); else { ukryjPisze(); pokazZespol([]); }
    przewin();
  }

  // ── pliki w folderze Konsylium ──
  // MsMost.czytaj zwraca {tekst, zmiana} albo null (brak pliku)
  function czytajTekst(p) { return window.MsMost.czytaj(p).then(function (r) { return r && typeof r === 'object' ? String(r.tekst || '') : String(r || ''); }); }
  function parsuj(t) { return String(t || '').split(/\r?\n/).map(function (l) { try { return l.trim() ? JSON.parse(l) : null; } catch (e) { return null; } }).filter(Boolean); }
  function zapiszStan(dod) {
    var s = { kod: Z.kod, numer: ++Z.numer, odbiorca: Z.odbiorca, czekaNaOdpowiedz: Z.czekam, zapisano: new Date().toISOString(), wiadomosci: Z.wiad.filter(function (w) { return w.od === 'uzytkownik'; }).length };
    if (dod) for (var k in dod) s[k] = dod[k];
    return window.MsMost.zapisz(sciezka('stan.json'), JSON.stringify(s, null, 2));
  }
  function dopiszWiad(w) {
    if (!Z.dostepny) { Z.wiad.push(w); odswiezWidok(); return Promise.resolve(); }
    return czytajTekst(sciezka('wiadomosci.jsonl')).catch(function () { return ''; }).then(function (stare) {
      stare = String(stare || '');
      return window.MsMost.zapisz(sciezka('wiadomosci.jsonl'), (stare && !stare.endsWith('\n') ? stare + '\n' : stare) + JSON.stringify(w) + '\n');
    }).then(function () { Z.wiad.push(w); odswiezWidok(); });
  }
  function odswiezZPliku() {
    if (!Z.dostepny || !Z.kod) return;
    czytajTekst(sciezka('wiadomosci.jsonl')).then(function (t) {
      var w = parsuj(t);
      if (w.length !== Z.wiad.length) { Z.wiad = w; if (w.length < Z.widoczne) Z.widoczne = 0; odswiezWidok(); zapiszStan(); }
    }).catch(function () {});
    czytajTekst(sciezka('panel.json')).then(function (t) {
      var p = null; try { p = JSON.parse(t); } catch (e) {}
      var role = p && p.pracuja ? p.pracuja : (Z.czekam ? ['prowadzacy'] : []);
      Z.panel = role; pokazZespol(role); if (Z.czekam) pokazPisze(role);
    }).catch(function () { Z.panel = Z.czekam ? ['prowadzacy'] : []; pokazZespol(Z.panel); if (Z.czekam) pokazPisze(Z.panel); });
  }
  function nowaRozmowa() {
    Z.kod = kodRozmowy(); Z.numer = 0; Z.wiad = []; Z.widoczne = 0; Z.czekam = false; Z.panel = [];
    $pomoc.hidden = true; ukryjPisze(); odswiezWidok(); pokazZespol([]);
    try { localStorage.setItem('ms-rozmowa-kod', Z.kod); } catch (e) {}
    if (Z.dostepny) zapiszStan().catch(function (e) { $blad.textContent = 'Nie udało się zapisać w folderze Konsylium: ' + e.message; });
  }

  // ── wysyłanie ──
  function dopasuj() { $tekst.style.height = 'auto'; $tekst.style.height = Math.min(140, $tekst.scrollHeight) + 'px'; }
  $tekst.addEventListener('input', dopasuj);
  $tekst.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('pisz').requestSubmit(); } });
  $('pisz').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = $tekst.value.trim(); if (!t) return;
    if (!Z.kod) nowaRozmowa();
    $wyslij.disabled = true; $blad.textContent = '';
    var w = { ts: new Date().toISOString(), od: 'uzytkownik', tekst: t, odbiorca: Z.odbiorca };
    var f = filtr(t);
    if (f.length) pokazPomoc('W tej wiadomości są słowa, które traktujemy poważnie. Zespół odpowie, ale najpierw numery pomocy.');
    dopiszWiad(w).then(function () {
      $tekst.value = ''; dopasuj(); Z.czekam = true; Z.panel = ['straznik', 'prowadzacy']; pokazZespol(Z.panel); pokazPisze(Z.panel);
      if (Z.dostepny) return zapiszStan(f.length ? { filtr: f, ostatnia: t } : { ostatnia: t });
      demoOdpowiedz(t, f);
    }).catch(function (err) { $blad.textContent = 'Nie udało się zapisać: ' + (err && err.message || err); })
      .then(function () { $wyslij.disabled = false; $tekst.focus(); });
  });
  // podgląd poza aplikacją: odpowiedź demonstracyjna, żeby okno dało się obejrzeć i przetestować
  function demoOdpowiedz(t, f) {
    Z.demo = true;
    setTimeout(function () { Z.panel = ['straznik', 'cbt', 'humanistyczny']; pokazZespol(Z.panel); pokazPisze(Z.panel); }, 900);
    setTimeout(function () {
      var w = f.length
        ? { ts: new Date().toISOString(), od: 'zespol', ryzyko: 3, przerwanie: true, panel: ['straznik', 'prowadzacy'],
            tekst: 'Dziękuję, że to napisałeś/napisałaś. To, o czym mówisz, wymaga teraz kontaktu z człowiekiem, nie z programem. Jeśli jesteś w zagrożeniu, zadzwoń pod 112. Całodobowo możesz zadzwonić pod 800 70 2222. Czy jest ktoś, kto może być teraz z Tobą? Zostańmy przy tym jednym pytaniu.',
            plan_bezpieczenstwa: 'Nie zostawaj sam/sama. Oddal od siebie leki i inne środki. Zadzwoń do jednej osoby z listy bliskich. (To podgląd bez aplikacji – prawdziwy plan buduje zespół z danych rozmowy.)' }
        : { ts: new Date().toISOString(), od: 'zespol', ryzyko: 0, panel: ['straznik', 'cbt', 'humanistyczny'], odbiorca: Z.odbiorca,
            tekst: 'To podgląd okna Rozmowy bez aplikacji MS Konsylium, więc odpowiada przykładowy tekst zespołu, nie Claude. 🙂\n\nW aplikacji każda Twoja wiadomość trafia do folderu Konsylium; strażnik ryzyka i dwa podejścia terapeutyczne piszą swoje głosy, a prowadzący scala je w jedną odpowiedź: co słyszy, co proponuje na najbliższe dni i jedno pytanie na koniec. Z czym najbardziej chcesz zacząć?',
            glosy: [{ rola: 'straznik', skrot: 'Brak sygnałów ryzyka w tej wiadomości; przesiew ujemny.' }, { rola: 'cbt', skrot: 'Zacząłbym od jednego mierzalnego celu na tydzień i dziennika sytuacji.' }, { rola: 'humanistyczny', skrot: 'Najpierw sprawdzić, czego ta osoba naprawdę chce od rozmowy.' }],
            spor: 'Humanistyczny: nie proponować techniki, zanim nie wybrzmi cel klienta.' };
      ukryjPisze(); Z.wiad.push(w); odswiezWidok();
    }, 3200);
  }
  // emotikony
  var $em = $('emoji'); $em.innerHTML = EMOJI.map(function (e) { return '<button type="button" data-e="' + e + '" aria-label="' + e + '">' + e + '</button>'; }).join('');
  $('emoji-btn').addEventListener('click', function () { $em.hidden = !$em.hidden; });
  $em.addEventListener('click', function (e) { var b = e.target.closest('[data-e]'); if (!b) return; var p = $tekst.selectionStart || $tekst.value.length; $tekst.value = $tekst.value.slice(0, p) + b.dataset.e + $tekst.value.slice(p); $tekst.focus(); $tekst.selectionStart = $tekst.selectionEnd = p + b.dataset.e.length; dopasuj(); });
  // odbiorca
  function ustawOdbiorce(o) { Z.odbiorca = o; $('odb-terapeuta').setAttribute('aria-pressed', String(o === 'terapeuta')); $('odb-klient').setAttribute('aria-pressed', String(o === 'klient')); $tekst.placeholder = o === 'klient' ? 'Napisz, co się dzieje… (odpowiedź będzie napisana wprost do Ciebie)' : 'Opisz konkretną sytuację klienta… (Enter wysyła, Shift+Enter nowa linia)'; if (Z.dostepny && Z.kod) zapiszStan().catch(function () {}); }
  $('odb-terapeuta').addEventListener('click', function () { ustawOdbiorce('terapeuta'); });
  $('odb-klient').addEventListener('click', function () { ustawOdbiorce('klient'); });
  $('nowa').addEventListener('click', nowaRozmowa);
  $('konsylium').addEventListener('click', function () {
    if (!Z.wiad.length) { $blad.textContent = 'Najpierw opisz sytuację – konsylium potrzebuje treści rozmowy.'; return; }
    dopiszWiad({ ts: new Date().toISOString(), od: 'uzytkownik', polecenie: 'konsylium', tekst: 'Zwołaj konsylium nad tą rozmową.' }).then(function () {
      Z.czekam = true; pokazPisze(['prowadzacy']);
      if (Z.dostepny) { zapiszStan({ polecenie: 'konsylium' }); if (window.MsMost.otworzModul) setTimeout(function () { window.MsMost.otworzModul('pokoj'); }, 1200); }
      else demoOdpowiedz('konsylium', []);
    });
  });
  // motyw z powłoki
  window.addEventListener('message', function (e) { var d = e.data; if (d && d.typ === 'ms-motyw') document.documentElement.setAttribute('data-motyw', d.motyw === 'ciemny' ? 'ciemny' : 'jasny'); });

  // start
  ekranStartowy(); pokazZespol([]);
  if (window.MsMost) window.MsMost.dostepny().then(function (jest) {
    Z.dostepny = !!jest;
    if (jest) {
      document.documentElement.classList.add('osadzony');
      // każdy start aplikacji = nowa, czysta rozmowa (jak w wywiadzie, Michał 1.11); poprzednie zostają w rozmowa/<KOD>/
      nowaRozmowa();
      Z.timer = setInterval(odswiezZPliku, 1500);
    }
  });
})();
</script>
</body>
</html>
