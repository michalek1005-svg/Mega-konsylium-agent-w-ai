:root {
  color-scheme: dark;
  --petrol: #5CC8BB; --ink: #E4EEEB; --mut: #93A9A4; --bg-viewport: #0F1918;
  --scene: radial-gradient(46vw 42vh at 100% -4%, rgba(64,168,158,.22) 0%, rgba(64,168,158,0) 70%),
           radial-gradient(50vw 46vh at -4% 104%, rgba(132,176,108,.16) 0%, rgba(132,176,108,0) 70%),
           linear-gradient(160deg, #121d1c 0%, #0b1413 100%);
  --tafla: rgba(20,32,31,.78);
  --tafla-cien: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.07), 0 40px 74px -34px rgba(0,0,0,.85);
  --panel: rgba(255,255,255,.05);
  --panel-cien: 0 14px 32px -25px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
  --btn: rgba(92,200,187,.12); --btn-h: rgba(92,200,187,.2); --btn-txt: #8fdcd2;
  --on: #1b7a70; --on-txt: #fff;
  --alarm: #ff9a8c; --ostrzezenie: #e9c46a; --ok: #6fd3a0;
  /* pokój */
  --sciana: #1a2a29; --sciana-2: #152322; --podloga: #101b1a; --podloga-linia: rgba(92,200,187,.06);
  --listwa: #24403c; --stol: #2b3d3a; --stol-blat: #34504b; --stol-krawedz: #1f302e;
  --szyba: rgba(140,210,220,.10); --szyba-obrys: rgba(160,220,225,.35);
  --okno-niebo: #0d2230; --okno-gwiazda: rgba(255,255,255,.55);
  --tablica: #e8efed; --tablica-txt: #14302D; --tablica-mut: #5C7570; --tablica-rama: #46625d;
  --cien-postaci: rgba(0,0,0,.45);
  --fartuch: #e7eeec; --fartuch-cien: #b8c7c3;
  --g-ordynator: #1b7a70; --g-lekarz: #3e8f9e; --g-zastepca: #6a8f5a; --g-sprawdzajacy: #7c7aa8; --g-rezydent: #b4875a; --g-prowadzacy: #b8622e;
  --dym: rgba(250,252,252,.72);
  --dymek: #f4f8f7; --dymek-txt: #14302D; --dymek-mut: #4d6762;
  --font: 'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Consolas, monospace;
}

    --petrol: #0F5E58; --ink: #14302D; --mut: #5C7570; --bg-viewport: #E9EFEC;

             linear-gradient(160deg, #E9EFEC 0%, #CFDCD8 100%);

    --panel-cien: 0 14px 32px -25px rgba(10,54,52,.55), inset 0 0 0 1px rgba(15,94,88,.13);

    --on: #0F5E58; --on-txt: #fff;
    --alarm: #A83A38; --ostrzezenie: #9a6b00; --ok: #1e7a4c;
    --sciana: #dfe9e6; --sciana-2: #d3e0dc; --podloga: #c3d3ce; --podloga-linia: rgba(15,94,88,.08);
    --listwa: #9fb9b3; --stol: #8fa9a2; --stol-blat: #b4cac4; --stol-krawedz: #7d968f;
    --szyba: rgba(120,190,200,.16); --szyba-obrys: rgba(15,94,88,.35);
    --okno-niebo: #9fd0dc; --okno-gwiazda: rgba(255,255,255,0);

    --cien-postaci: rgba(10,54,52,.22);
    --dymek: #ffffff; --dym: rgba(238,243,242,.4);

}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font); font-size: 14px; color: var(--ink);
  background: var(--scene); background-attachment: fixed; background-color: var(--bg-viewport);
}
.scena { padding-block: 18px 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; max-width: 1500px; margin: 0 auto; }

/* nagłówek: logo K jak N w Nawigatorze */
.naglowek { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; flex: none;
  font-weight: 800; font-size: 26px; letter-spacing: -1px; color: #F7FBFA;
  background: linear-gradient(150deg, #157268, #0F5E58);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.25), 0 12px 24px -12px rgba(10,54,52,.7); }
.tytul { flex: 1; min-width: 200px; }
.tytul h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.4px; text-wrap: balance; }
.tytul p { margin: 3px 0 0; font-size: 12px; color: var(--mut); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.kropka { width: 8px; height: 8px; border-radius: 50%; background: #3fbf8a; box-shadow: 0 0 0 3px rgba(63,191,138,.2); }
.chip { font-size: 10.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  background: var(--btn); color: var(--btn-txt); }
.pasek { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px; border-radius: 999px; background: var(--tafla); box-shadow: var(--tafla-cien);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.nk-button { border: 0; border-radius: 22px; padding: 8px 14px; min-height: 38px; background: var(--btn); color: var(--btn-txt);
  font: inherit; font-size: 12.5px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  cursor: pointer; line-height: 1.3; transition: background .15s; user-select: none; }
.nk-button:hover { background: var(--btn-h); }
.nk-button:focus-visible, .postac:focus-visible, .wpis:focus-visible, .odcinek:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; }
.nk-button:not(:disabled):active { box-shadow: inset 4px 4px 8px rgba(0,0,0,.25), inset -3px -3px 7px rgba(255,255,255,.08); }
.nk-on, .nk-on:hover { background: var(--on); color: var(--on-txt); box-shadow: 0 8px 20px -13px var(--on); }
.nk-label { font-size: 10.5px; letter-spacing: .07em; font-weight: 750; text-transform: uppercase; color: var(--mut); margin: 0; }

/* układ: pokój + protokół */
.uklad { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 1060px) { .uklad { grid-template-columns: 1fr; } }
.tafla { border-radius: 30px; background: var(--tafla); box-shadow: var(--tafla-cien);
  backdrop-filter: blur(26px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(140%); }

.pokoj-ramka { padding: 12px; min-width: 0; }
.pokoj { position: relative; width: 100%; aspect-ratio: 1200 / 700; max-width: 100%; border-radius: 22px; overflow: hidden;
  container-type: inline-size; background: var(--sciana); }
.pokoj svg.rys { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* tablica na ścianie: o czym teraz dyskusja */

/* postacie */
.postac { cursor: pointer; transition: opacity .35s, filter .35s; }

/* głos lekarza prowadzącego (tylko w aplikacji, na żywo) */

@container (max-width: 620px) { .dymek:not(.pisze) { display: none; } .tablica .ranking, .tablica .werdykt, .tablica .temat, .tablica .ustalenia, .tablica .etap span { display: none; } .tablica { justify-content: center; } .tablica .faza { font-size: 11px; } }

/* pasek etapów na dole usunięty (Michał 1.11: nieczytelny) — stan prac jest na tablicy w pokoju */

select.tempo { border: 0; border-radius: 22px; min-height: 38px; padding: 0 12px; background: var(--btn); color: var(--btn-txt); font: inherit; font-size: 12.5px; font-weight: 650; }

.wpis:hover { background: var(--panel); }

/* w aplikacji MS Konsylium (powłoka z szklaną taflą i paskiem ikon): bez własnego tła, logo i przełącznika motywu */
html.osadzony, html.osadzony body { background: transparent !important; }

/* w aplikacji scena mieści się w oknie razem z paskiem sterowania */

/* przerwa: AI pracuje, lekarze poza pokojem */

.tablica .ai-kropki i:nth-child(2) { animation-delay: .22s; } .tablica .ai-kropki i:nth-child(3) { animation-delay: .44s; }

<script>
// Pokój lekarski — parser sprawy Konsylium na „scenariusz” do odtworzenia w pokoju.
// Wejście: obiekt { "ścieżka/względna/w/sprawie": "treść pliku" } (np. "03-opinie/bayes.json").
// Wyjście: { sprawa, tryb, sceny: [{ id, tytul, temat, czas, wypowiedzi: [{ kto, skrot, pelny, plik }] }], tablica }
// Działa w Node (testy, build) i w przeglądarce (wczytanie folderu sprawy), bez zależności i bez sieci.
//
// Dwa źródła dymków:
//  1. Zdarzenia "wypowiedz" w _log.jsonl (proponowany format na żywo, patrz README) — mają pierwszeństwo.
//  2. Gdy ich brak: skróty wyliczane z plików 01–10 (heurystyki poniżej).

const ROLE = {
  ordynator:            { nazwa: 'Ordynator', grupa: 'ordynator', inicjaly: 'O' },
  z_zlozonosc:          { nazwa: 'Zastępca · złożoność', grupa: 'zastepca', inicjaly: 'ZZ' },
  z_bezpieczenstwo:     { nazwa: 'Zastępca · bezpieczeństwo', grupa: 'zastepca', inicjaly: 'ZB' },
  z_niepewnosc:         { nazwa: 'Zastępca · niepewność', grupa: 'zastepca', inicjaly: 'ZN' },
  hipotezujacy:         { nazwa: 'Hipotezujący', grupa: 'lekarz', inicjaly: 'H' },
  bayes:                { nazwa: 'Bayesowski', grupa: 'lekarz', inicjaly: 'B' },
  najgorszy_scenariusz: { nazwa: 'Najgorszy scenariusz', grupa: 'lekarz', inicjaly: 'NS' },
  poz_pragmatyk:        { nazwa: 'Pragmatyk POZ', grupa: 'lekarz', inicjaly: 'P' },
  farmakolog:           { nazwa: 'Farmakolog', grupa: 'lekarz', inicjaly: 'F' },
  gospodarz_kosztow:    { nazwa: 'Gospodarz kosztów', grupa: 'lekarz', inicjaly: 'GK' },
  s_fakty:              { nazwa: 'Sprawdzający faktów', grupa: 'sprawdzajacy', inicjaly: 'SF' },
  s_proces:             { nazwa: 'Sprawdzający procesu', grupa: 'sprawdzajacy', inicjaly: 'SP' },
  R1: { nazwa: 'Rezydent R1', grupa: 'rezydent', inicjaly: 'R1' },
  R2: { nazwa: 'Rezydent R2', grupa: 'rezydent', inicjaly: 'R2' },
  R3: { nazwa: 'Rezydent R3', grupa: 'rezydent', inicjaly: 'R3' },
  // użytkownik aplikacji (lekarz POZ) — dopisuje do dyskusji z Pokoju; plik sprawy/<ID>/uwagi-lekarza.jsonl
  lekarz_prowadzacy:    { nazwa: 'Lekarz prowadzący', grupa: 'prowadzacy', inicjaly: 'LP' },
};

const LEKARZE = ['hipotezujacy', 'bayes', 'najgorszy_scenariusz', 'poz_pragmatyk', 'farmakolog', 'gospodarz_kosztow'];

// różne zapisy tej samej roli w plikach sprawy → identyfikator
function rola(nazwa) {
  if (!nazwa) return null;
  const n = String(nazwa).trim().toLowerCase()
    .replace(/^lekarz[-_ ]/, '').replace(/[-\s]+/g, '_')
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
  if (/^r\d$/.test(n)) return n.toUpperCase();
  if (n.startsWith('rezydent')) { const m = n.match(/\d/); return m ? 'R' + m[0] : 'R1'; }
  const mapa = {
    zastepca_zlozonosc: 'z_zlozonosc', zlozonosc: 'z_zlozonosc',
    zastepca_bezpieczenstwo: 'z_bezpieczenstwo', bezpieczenstwo: 'z_bezpieczenstwo',
    zastepca_niepewnosc: 'z_niepewnosc', niepewnosc: 'z_niepewnosc',
    sprawdzajacy_faktow: 's_fakty', fakty: 's_fakty', sprawdzajacy_procesu: 's_proces', proces: 's_proces',
    poz: 'poz_pragmatyk', pragmatyk: 'poz_pragmatyk', najgorszy: 'najgorszy_scenariusz', koszty: 'gospodarz_kosztow',
    prowadzacy: 'lekarz_prowadzacy', lekarz_prowadzacy: 'lekarz_prowadzacy', uzytkownik: 'lekarz_prowadzacy', lekarz_poz: 'lekarz_prowadzacy',
  };
  return ROLE[n] ? n : (mapa[n] || null);
}

// --- pomocnicze -----------------------------------------------------------

const P = (x) => (typeof x === 'number' ? x.toFixed(2).replace('.', ',') : x);

function bezMarkdown(t) {
  return String(t || '')
    .replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1').replace(/^\s*[-*]\s+/gm, '').replace(/^#+\s*/gm, '')
    .replace(/\s+/g, ' ').trim();
}

// skraca do pełnych słów, z wielokropkiem
// dymek: 1–2 pełne zdania, najwyżej 400 znaków (decyzja Michała 31.10.2026, docs/DYMKI.md)
const MAX_DYMEK = 400;
function utnij(t, max = MAX_DYMEK) {
  t = bezMarkdown(t);
  if (t.length <= max) return t;
  const cut = t.slice(0, max - 1);
  const sp = cut.lastIndexOf(' ');
  return cut.slice(0, sp > max * 0.6 ? sp : cut.length).replace(/[,;:.\s—-]+$/, '') + '…';
}

const SKROTY = /(?:^|[\s(])(?:np|m\.in|tj|ok|wsp|dr|prof|godz|min|ul|tzw|itd|itp|por|ryc|tab|wg|r|ok|mg|ml|[A-ZŁŚŻŹĆŃÓa-ząęłńóśźż])\.$/;
function pierwszeZdanie(t) {
  t = bezMarkdown(t);
  const re = /[.!?](?=\s|$)/g;
  let m;
  while ((m = re.exec(t))) {
    const przed = t.slice(0, m.index + 1);
    if (SKROTY.test(przed)) continue;
    return przed;
  }
  return t;
}
const wielka = (t) => (t ? t[0].toUpperCase() + t.slice(1) : t);

function json(pliki, sciezka) {
  const t = pliki[sciezka];
  if (!t) return null;
  try { return JSON.parse(t); } catch { return null; }
}

// _log.jsonl (dymki agentów, dymek.py) + uwagi-lekarza.jsonl (wpisy lekarza prowadzącego z Pokoju); kolejność po czasie
function log(pliki) {
  const linie = (t) => (t ? t.split(/\r?\n/).map((l) => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean) : []);
  const agenci = linie(pliki['_log.jsonl']);
  const lekarz = linie(pliki['uwagi-lekarza.jsonl']).map((z) => ({ ...z, zdarzenie: z.zdarzenie || 'wypowiedz', rola: 'lekarz_prowadzacy' }));
  if (!lekarz.length) return agenci;
  // stabilnie: wpis lekarza trafia za ostatnim dymkiem, który jest od niego starszy
  const wynik = [...agenci];
  for (const u of lekarz) {
    let k = wynik.length;
    while (k > 0 && wynik[k - 1].ts && u.ts && wynik[k - 1].ts > u.ts) k--;
    wynik.splice(k, 0, u);
  }
  return wynik;
}

// pole „ETYKIETA: treść” z plików 05/09 (format FINAL)
// Wnioski końcowe z 09-FINAL.md (format CLAUDE.md §6) → [{ etykieta, tresc }] dla ekranu „Wnioski”
const POLA_FINAL = ['REKOMENDACJA', 'PILNOŚĆ', 'DLACZEGO', 'PLAN B', 'CZEGO NIE WIEMY', 'WRÓĆ / ESKALUJ GDY', 'ŹRÓDŁA'];
function wnioskiZFinal(md) {
  if (!md || !md.trim()) return null;
  const linie = md.replace(/\r/g, '').split('\n');
  const out = []; let biez = null; const reszta = [];
  for (const l of linie) {
    const czysta = l.replace(/^\s*[#>*-]*\s*\**/, '').replace(/\*\*/g, '');
    const m = czysta.match(/^([A-ZĄĆĘŁŃÓŚŹŻ][A-ZĄĆĘŁŃÓŚŹŻ /]+?)\s*:\s*(.*)$/);
    if (m && POLA_FINAL.some((p) => m[1].trim().toUpperCase().startsWith(p))) { biez = { etykieta: m[1].trim(), tresc: m[2].trim() }; out.push(biez); continue; }
    if (/^\s*—\s*Narzędzie testowe/.test(l)) { biez = null; continue; }
    if (biez) biez.tresc += (biez.tresc ? '\n' : '') + l.trim(); else if (l.trim()) reszta.push(l.trim());
  }
  out.forEach((x) => { x.tresc = bezMarkdown(x.tresc).trim(); });
  return { pola: out, tekst: bezMarkdown(md).trim(), wstep: reszta.filter((x) => !/^#/.test(x)).slice(0, 3).join(' ') };
}

function pole(md, etykieta) {
  if (!md) return '';
  const re = new RegExp('^' + etykieta + '\\s*:\\s*(.*)$', 'mi');
  const m = md.match(re);
  return m ? m[1].trim() : '';
}

// sekcje markdown na danym poziomie: [{ tytul, tresc }]
function sekcje(md, poziom) {
  const znacznik = '#'.repeat(poziom) + ' ';
  const out = [];
  let biez = null;
  for (const linia of String(md || '').split(/\r?\n/)) {
    if (linia.startsWith(znacznik)) { biez = { tytul: linia.slice(znacznik.length).trim(), tresc: '' }; out.push(biez); continue; }
    if (biez && poziom > 1 && /^#{1,}\s/.test(linia) && !linia.startsWith('#'.repeat(poziom + 1))) { biez = null; continue; }
    if (biez) biez.tresc += linia + '\n';
  }
  return out;
}

// dymek lekarza z rundy: „Decyzja / Zmiany / Top-2” → pierwsze zdanie, inaczej „Co mnie przekonuje”
// linia „SKRÓT: …” napisana przez samego agenta (docs/DYMKI.md) ma pierwszeństwo przed heurystyką
function skrotAgenta(tresc) {
  const m = String(tresc || '').match(/^\s*\**SKRÓT\**\s*:\s*\**\s*(.+)$/im);
  return m ? utnij(m[1]) : null;
}

function skrotRundy(tresc) {
  const wlasny = skrotAgenta(tresc);
  if (wlasny) return wlasny;
  const czysty = String(tresc || '');
  const etykiety = [/\*\*(Decyzja|Zmiany?|Zmiana top-2[^*]*|Top-2[^*]*)[:：]?\*\*:?\s*([^\n]+)/i,
                    /\*\*(Co mnie przekonuje|Przekonuje mnie)[^*]*\*\*:?\s*([^\n]+)/i];
  for (const re of etykiety) {
    const m = czysty.match(re);
    if (m && m[2].trim()) {
      let z = wielka(pierwszeZdanie(m[2]));
      if (re === etykiety[0]) {
        const pk = czysty.match(etykiety[1]);
        if (pk) z += ' ' + wielka(pierwszeZdanie(pk[2]));
      }
      const zm = czysty.match(/\*\*(Co by zmieniło|Co zmieniłoby|Zmieniłoby)[^*]*\*\*:?\s*([^\n]+)/i);
      if (zm && z.length < 260) z += ' Zmieniłoby zdanie: ' + pierwszeZdanie(zm[2]).replace(/^./, (c) => c.toLowerCase());
      return utnij(z);
    }
  }
  return utnij(wielka(pierwszeZdanie(czysty)));
}

const wyp = (kto, skrot, pelny, plik) => ({ kto, skrot: utnij(wielka(bezMarkdown(skrot))), pelny: bezMarkdown(pelny || skrot), plik: plik || null });

// --- format na żywo: zdarzenia "wypowiedz" w _log.jsonl (docs/DYMKI.md) ------

// kanoniczne fazy: nazwa z dymka → identyfikator sceny i kolejność
const FAZY = [
  ['wywiad', /^wywiad/i, 'Wywiad'], ['triage', /^triage/i, 'Triage'], ['slepa', /^[śs]lepa/i, 'Ślepa tura'],
  ['agregat', /^agregac/i, 'Agregacja'], ['runda', /runda\s*(\d+)/i, 'Konsylium · runda'], ['projekt', /^projekt/i, 'Projekt'],
  ['rezydenci', /^rezydenc/i, 'Rezydenci'], ['sprawdzenie', /^sprawdz/i, 'Sprawdzenie'], ['odpowiedz', /^odpowied/i, 'Odpowiedź rezydentom'],
  ['final', /^(werdykt|final)/i, 'Werdykt'], ['followup', /^follow/i, 'Follow-up'],
];
function fazaNaId(faza) {
  const f = String(faza || '').trim();
  for (const [id, re, tytul] of FAZY) {
    const m = f.match(re);
    if (m) return id === 'runda' ? { id: 'runda' + m[1], tytul: `${tytul} ${m[1]}`, rz: FAZY.findIndex((x) => x[0] === 'runda') + m[1] / 100 }
                                 : { id, tytul, rz: FAZY.findIndex((x) => x[0] === id) };
  }
  if (/konsylium|dyskusj/i.test(f)) return { id: 'runda1', tytul: 'Konsylium · runda 1', rz: 4.01 };
  return { id: 'inne-' + f.toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/g, '-'), tytul: f || 'Konsylium', rz: 99 };
}

function zLogu(zdarzenia) {
  const mapa = new Map();
  for (const z of zdarzenia) {
    if (z.zdarzenie !== 'wypowiedz' || !z.skrot) continue;
    const f = fazaNaId(z.faza);
    let s = mapa.get(f.id);
    if (!s) { s = { id: f.id, tytul: f.tytul, temat: null, czas: z.ts || null, rz: f.rz, wypowiedzi: [] }; mapa.set(f.id, s); }
    if (z.temat) s.temat = utnij(z.temat, 160);
    const w = wyp(rola(z.rola || z.agent) || 'ordynator', z.skrot, z.pelny || z.tresc || z.skrot, z.plik);
    if (z.persona) w.persona = z.persona;
    // pełniejsza wypowiedź do dymku (2–4 zdania językiem medycznym) i linia z liczbami/skalami
    if (z.tresc) w.tresc = bezMarkdown(String(z.tresc)).replace(/\s+/g, ' ').trim().slice(0, 700);
    if (z.info) w.info = bezMarkdown(String(z.info)).replace(/\s+/g, ' ').trim().slice(0, 240);
    s.wypowiedzi.push(w);
  }
  return [...mapa.values()];
}

// łączy sceny z dymków (pierwszeństwo) ze scenami wyliczonymi z plików
function polacz(zywe, zPlikow) {
  const wynik = zPlikow.map((s) => ({ ...s, rz: fazaNaId(s.tytul).rz }));
  for (const z of zywe) {
    const k = wynik.findIndex((s) => s.id === z.id);
    // same uwagi lekarza prowadzącego nie zastępują sceny wyliczonej z plików — dopisują się na jej koniec
    const tylkoLekarz = z.wypowiedzi.length && z.wypowiedzi.every((w) => w.kto === 'lekarz_prowadzacy');
    if (k >= 0 && tylkoLekarz) wynik[k] = { ...wynik[k], wypowiedzi: [...wynik[k].wypowiedzi, ...z.wypowiedzi] };
    else if (k >= 0) wynik[k] = { ...wynik[k], ...z, temat: z.temat || wynik[k].temat, czas: z.czas || wynik[k].czas };
    else wynik.push({ ...z, temat: z.temat || z.tytul });
  }
  return wynik.sort((a, b) => a.rz - b.rz).map(({ rz, ...s }) => s);
}

// --- format z plików sprawy -----------------------------------------------

function czasZdarzenia(zdarzenia, ...nazwy) {
  const z = zdarzenia.find((e) => nazwy.some((n) => String(e.zdarzenie || '').startsWith(n)));
  return z ? z.ts : null;
}

function zbudujScenariusz(pliki, nazwaSprawy = '') {
  const zdarzenia = log(pliki);
  const zywe = zLogu(zdarzenia);
  const triage = json(pliki, '02-triage.json');
  const agregat = json(pliki, '03-opinie/_agregat-synonimy.json') || json(pliki, '03-opinie/_agregat.json');
  const tablica = {
    tryb: triage?.tryb || null,
    ranking: (agregat?.ranking || []).slice(0, 5).map((r) => ({ nazwa: r.rozpoznanie, p: r.p })),
    zgoda: agregat?.zgoda ?? null,
    pilnosc: agregat?.pilnosc?.wynik ?? null,
    pewnosc: null,
    werdykt: null,
    followup: null,
  };
  const final = pliki['09-FINAL.md'];
  if (final) {
    tablica.werdykt = pole(final, 'REKOMENDACJA');
    const pp = pole(final, 'PILNOŚĆ');
    const mp = pp.match(/^(\d)/); if (mp) tablica.pilnosc = +mp[1];
    const mw = pp.match(/PEWNOŚĆ:\s*(\S+)/i); if (mw) tablica.pewnosc = mw[1];
  }
  const fu = pliki['10-followup.md'];
  if (fu) {
    const m = fu.match(/rozpoznanie_potwierdzone:\s*(.+)/); const d = fu.match(/czy_decyzja_byla_wlasciwa:\s*(.+)/);
    tablica.followup = { rozpoznanie: m ? m[1].trim() : null, decyzja: d ? d[1].trim() : null };
  }

  const sceny = [];
  const lider = tablica.ranking[0];
  const liderTxt = lider ? `„${lider.nazwa}” (p ${P(lider.p)})` : 'wiodąca hipoteza';

  // 1. wywiad
  const wywiad = pliki['01-wywiad.md'];
  if (wywiad) {
    const tury = (wywiad.match(/^###\s*Tura/gim) || []).length || 1;
    const niezn = (wywiad.split(/##\s*NIEZNANE/i)[1] || '').split('\n').filter((l) => /^\s*-\s/.test(l));
    sceny.push({
      id: 'wywiad', tytul: 'Wywiad', czas: czasZdarzenia(zdarzenia, 'wywiad', 'start'),
      temat: 'Ordynator zbiera wywiad: co wiemy o pacjencie, a czego wciąż nie wiemy.',
      wypowiedzi: [wyp('ordynator',
        `Wywiad zamknięty po ${tury} ${tury === 1 ? 'turze' : 'turach'}. Zostaje ${niezn.length} rzeczy NIEZNANYCH, m.in. ${bezMarkdown(niezn[0] || '').replace(/^-\s*/, '') || 'brak'}.`,
        niezn.join('\n') || wywiad, '01-wywiad.md')],
    });
  }

  // 2. triage
  if (triage?.zastepcy) {
    const w = triage.zastepcy.map((z) => {
      const kto = rola('zastepca_' + z.zastepca) || 'z_zlozonosc';
      const dec = z.eskaluj ? 'eskaluję do pełnego konsylium' : 'bez eskalacji';
      let s = `Wynik ${z.wynik}, ${dec}.`;
      if (z.zastepca === 'bezpieczenstwo') {
        const obecne = (z.flagi || []).filter((f) => f.status === 'OBECNA').length;
        s = `Red flags obecne: ${obecne}. Pilność wstępna ${z.pilnosc_wstepna ?? '?'}, ${dec}.`;
      }
      if (z.zastepca === 'niepewnosc' && 'zgodne' in z) s = `Moja hipoteza ${z.zgodne ? 'zgodna' : 'NIEZGODNA'} z ordynatorem. Wynik ${z.wynik}, ${dec}.`;
      return wyp(kto, s, z.uzasadnienie || s, '02-triage.json');
    });
    w.push(wyp('ordynator', `Tryb ${triage.tryb === 'PELNY' ? 'pełny' : 'szybki'}${triage.liczba_rezydentow ? `, z ${triage.liczba_rezydentow} rezydentami` : ''}.`,
      `Tryb: ${triage.tryb}. Wystarczy jeden zastępca, żeby włączyć pełne konsylium.`, '02-triage.json'));
    sceny.push({ id: 'triage', tytul: 'Triage', czas: czasZdarzenia(zdarzenia, 'triage'),
      temat: 'Trzech zastępców ocenia, czy sprawa wymaga pełnego konsylium.', wypowiedzi: w });
  }

  // 3. ślepa tura
  const slepa = [];
  for (const r of LEKARZE) {
    const o = json(pliki, `03-opinie/${r}.json`);
    if (!o) continue;
    const roz = (o.rozpoznania || []).filter((x) => x.p > 0).sort((a, b) => b.p - a.p);
    let s;
    const arg = roz.length && (roz[0].za || [])[0] ? String(roz[0].za[0]).split('→')[0].replace(/[\s.;,]+$/, '') : '';
    if (roz.length) s = `Stawiam na „${roz[0].nazwa}” (p ${P(roz[0].p)}).${arg ? ` Za: ${arg}.` : ''}`
      + `${roz[1] ? ` Dalej „${roz[1].nazwa}” (p ${P(roz[1].p)}).` : ''} Pilność ${o.pilnosc}, pewność ${{ srednia: 'średnia', wysoka: 'wysoka', niska: 'niska' }[o.pewnosc] || o.pewnosc}.`;
    else if (o.nastepny_krok) s = `Nie ważę rozpoznań. Pierwszy krok: ${pierwszeZdanie(o.nastepny_krok)}`;
    else s = `Pilność ${o.pilnosc}, pewność ${{ srednia: 'średnia', wysoka: 'wysoka', niska: 'niska' }[o.pewnosc] || o.pewnosc}.`;
    const pelny = roz.map((x) => `${x.nazwa}: p ${P(x.p)}`).join('\n') + (o.nastepny_krok ? `\nNastępny krok: ${o.nastepny_krok}` : '');
    slepa.push(wyp(r, s, pelny, `03-opinie/${r}.json`));
  }
  const zLekarza = zdarzenia.find((e) => LEKARZE.includes(rola(e.rola || e.agent)));
  if (slepa.length) sceny.push({ id: 'slepa', tytul: 'Ślepa tura', czas: zLekarza ? zLekarza.ts : null,
    temat: 'Każdy lekarz pisze opinię sam, bez wglądu w opinie innych.', wypowiedzi: slepa });

  // 4. agregacja
  if (agregat) {
    const top = tablica.ranking.slice(0, 3).map((r) => `${r.nazwa} ${P(r.p)}`).join('; ');
    sceny.push({ id: 'agregat', tytul: 'Agregacja', czas: czasZdarzenia(zdarzenia, 'agregacja'),
      temat: 'Ordynator łączy opinie ważoną pulą log-odds.',
      wypowiedzi: [wyp('ordynator', `Ranking: ${top}. Zgoda ${P(tablica.zgoda)}${(agregat.flagi || []).length ? `, flagi: ${agregat.flagi.join(', ')}` : ''}.`,
        tablica.ranking.map((r) => `${r.nazwa}: ${P(r.p)}`).join('\n'), '03-opinie/_agregat.json')] });
  }

  // 5. konsylium (04): uwagi procesowe, sprzeczności, rundy, zamknięcie
  const kons = pliki['04-konsylium.md'];
  if (kons) {
    const glowne = sekcje(kons, 2);
    const sprz = glowne.find((s) => /^Sprzeczno/i.test(s.tytul));
    const uwagi = glowne.find((s) => /^Uwagi procesowe/i.test(s.tytul));
    const pierwszaSprz = sprz ? bezMarkdown(sprz.tresc.split('\n').find((l) => /^\s*-\s/.test(l)) || '') : '';
    for (const sek of glowne) {
      const mr = sek.tytul.match(/^Runda\s+(\d+)/i);

}

// Tablica ustaleń (Michał 1.11): lekarze zapisują na tablicy najważniejsze rzeczy, odrzucone skreślają.
// Zdarzenie w _log.jsonl: {"zdarzenie":"tablica","tekst":"…","skreslone":true|false,"faza":"…"} (skrypty/dymek.py --tablica / --skresl).
// Każdy wpis dostaje numer sceny (si), od której jest widoczny; „skreśl” tego samego tekstu przekreśla wcześniejszy wpis.
function ustaleniaZLogu(zdarzenia, sceny) {
  const out = [];
  const norm = (s) => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  for (const z of zdarzenia) {
    if (z.zdarzenie !== 'tablica' || !z.tekst) continue;
    const f = z.faza ? fazaNaId(z.faza) : null;
    let si = f ? sceny.findIndex((s) => s.id === f.id) : -1;
    if (si < 0) si = f ? Math.max(0, sceny.findIndex((s) => fazaNaId(s.tytul).rz > f.rz) - 1) : sceny.length - 1;
    if (si < 0) si = Math.max(0, sceny.length - 1);
    const tekst = utnij(bezMarkdown(String(z.tekst)).replace(/\s+/g, ' ').trim(), 140);
    const stary = z.skreslone ? out.find((u) => !u.skreslone && norm(u.tekst) === norm(tekst)) : null;
    if (stary) { stary.skreslone = true; stary.siSkreslenia = si; continue; }
    out.push({ tekst, skreslone: !!z.skreslone, si, siSkreslenia: z.skreslone ? si : null, kto: z.rola ? rola(z.rola) : null });
  }
  return out;
}

astępny krok: Poprosić pacjentkę, by przy kolejnym epizodzie wypłukała i obejrzała (lub zachowała/sfotografowała) kulkę i porównała z tabletką Siofor XR, a do tego czasu przyjmowała ją w całości, bez dzielenia i rozkruszania, z wieczornym posiłkiem — bez zmiany leczenia.","plik":"03-opinie/farmakolog.json"},{"kto":"gospodarz_kosztow","skrot":"Nie ważę rozpoznań. Pierwszy krok: Bez nowych badań: poprosić pacjentkę, by przy następnym wystąpieniu wyłowiła kulkę, opłukała ją wodą i porównała kształt/rozmiar z tabletką Siofor XR (lub przyniosła do poradni), z jednoczesnym potwierdzeniem, że połyka tabletkę w całości z posiłkiem wieczornym, oraz zwiększyła podaż płynów i obserwowała barwę moczu.","pelny":"Następny krok: Bez nowych badań: poprosić pacjentkę, by przy następnym wystąpieniu wyłowiła kulkę, opłukała ją wodą i porównała kształt/rozmiar z tabletką Siofor XR (lub przyniosła do poradni), z jednoczesnym potwierdzeniem, że połyka tabletkę w całości z posiłkiem wieczornym, oraz zwiększyła podaż płynów i obserwowała barwę moczu.","plik":"03-opinie/gospodarz_kosztow.json"}]},{"id":"agregat","tytul":"Agregacja","czas":"2026-10-31T12:35:08+00:00","temat":"Ordynator łączy opinie ważoną pulą log-odds.","wypowiedzi":[{"kto":"ordynator","skrot":"Ranking: pozostałość tabletki metforminy xr 0,82; zagęszczenie moczu 0,08; niestrawione resztki pokarmowe 0,05. Zgoda 0,63.","pelny":"pozostałość tabletki metforminy xr: 0,82 zagęszczenie moczu: 0,08 niestrawione resztki pokarmowe: 0,05 kamica żółciowa: 0,01 robaczyca jelitowa: 0,01","plik":"03-opinie/_agregat.json"}]},{"id":"runda1","tytul":"Konsylium · runda 1","czas":"2026-10-31T12:39:26Z","temat":"Czy „pozostałość tabletki metforminy xr” (p 0,82) się utrzyma? Co zmieniłoby zdanie lekarzy.","wypowiedzi":[{"kto":"ordynator","skrot":"Korekta faktu: Co-Prestarium 10/10 to peryndopryl + amlodypina, nie indapamid (najgorszy scenariusz i zastępca bezpieczeństwa wpisali indapamid).","pelny":"Hipoteza ordynatora była tym razem w osobnym pliku _hipoteza-ordynatora.md (czytał ją tylko zastępca niepewności). Ślepa tura bez przecieku. Agregat surowy znów rozbił to samo rozpoznanie na kilka nazw („tabletka widmo”, „pozostałość tabletki…”, „objawy polekowe — metformina”). Przeliczone na kopii z dopisanymi synonimami: _agregat-synonimy.json (zgoda 0,63, bez flagi NISKA_ZGODA → 1 runda). config/ bez zmian. Sprawa ma dwa odrębne problemy (obiekt w stolcu, barwa moczu). Agregacja log-odds traktuje rozpoznania jako wzajemnie wykluczające się, więc p „zagęszczenia moczu” jest zaniżone. Czytamy je osobno. Korekta faktu: Co-Prestarium 10/10 to peryndopryl + amlodypina, nie indapamid (najgorszy scenariusz i zastępca bezpieczeństwa wpisali indapamid). Ezehron Duo 20/10 to rosuwastatyna + ezetymib. [wiedza modelu, do potwierdzenia w ChPL]","plik":"04-konsylium.md"},{"kto":"hipotezujacy","skrot":"Top-2 p zostaje (tabletka 0,6, zagęszczenie moczu 0,2). Zgodność czasowa kulki z przyjęciem Siofor XR, jedna kulka na epizod i prawidłowe wyniki laboratoryjne. Zmieniłoby zdanie: kulka niepodobna do tabletki (twarda, warstwowa, segmentowana albo ruchoma).","pelny":"Co mnie przekonuje: zgodność czasowa kulki z przyjęciem Siofor XR, jedna kulka na epizod i prawidłowe wyniki laboratoryjne. Korekta, że Co-Prestarium to peryndopryl z amlodypiną, a nie indapamid, nie zmienia obrazu. Rozdzielenie dwóch problemów jest słuszne. Co by zmieniło moje zdanie: kulka niepodobna do tabletki (twarda, warstwowa, segmentowana albo ruchoma). Zmieniłaby je też ciemny mocz z bilirubiną, krwią lub wysokim CK (kinazą kreatynową) w badaniu sprzed świeżego epizodu. Zmieniłaby je również data badań sprzed objawów. Decyzja: top-2 p zostaje (tabletka 0,6, zagęszczenie moczu 0,2). Pilność zostaje 4 (planowo), pewność średnia. Niezbędny element planu: przy następnym epizodzie zachować kulkę i oznaczyć datę badań laboratoryjnych. Jeśli są sprzed ciemnego moczu, powtórzyć je tego dnia.","plik":"04-konsylium.md"},{"kto":"bayes","skrot":"Top-2 bez zmian (tabletka 0,70, resztki pokarmowe 0,12). Zbieżność 4 lekarzy na ghost tablet (agregat 0,82). Zmieniłoby zdanie: obiekt ruchomy, segmentowany lub twardy i krystaliczny.","pelny":"Co mnie przekonuje: zbieżność 4 lekarzy na ghost tablet (agregat 0,82). Moje 0,70 było ostrożniejsze, bo obiekt jest nieobejrzany. Pretest u osoby na metforminie XR plus jedna kulka na dobę to silne LR. Ciemny mocz traktuję osobno, jako zagęszczenie (około 0,10–0,15). Co by zmieniło moje zdanie: obiekt ruchomy, segmentowany lub twardy i krystaliczny. Zmieniłoby je też to, że badania są sprzed ciemnego moczu, albo dodatnia bilirubinuria, krew w moczu, wzrost CK lub ALT. Zmiany: top-2 bez zmian (tabletka 0,70, resztki pokarmowe 0,12). Pilność pozostaje 4. Niezbędny element planu: ustalić daty badań laboratoryjnych. Jeśli są sprzed objawów, powtórzyć w dniu ciemnego moczu: badanie ogólne moczu z ciężarem właściwym, bilirubinę, ALT, CK i kreatyninę. Do tego oględziny kulki i porównanie z tabletką.","plik":"04-konsylium.md"},{"kto":"poz_pragmatyk","skrot":"Zostawiam p ≈ 0,6 dla tabletki widmo i p ≈ 0,15 dla zagęszczenia moczu, bo agregat 0,82 / 0,08 jest rozsądny. Zgodność 4 lekarzy co do tabletki widmo (Siofor XR) oraz korekta faktu, że Co-Prestarium to peryndopryl i amlodypina, nie indapamid. Zmieniłoby zdanie: kulka twarda, krystaliczna, ruchoma lub segmentowana, albo niezwiązana z porą przyjęcia leku.","pelny":"Przekonuje mnie: zgodność 4 lekarzy co do tabletki widmo (Siofor XR) oraz korekta faktu, że Co-Prestarium to peryndopryl i amlodypina, nie indapamid. Zmieniłoby zdanie: kulka twarda, krystaliczna, ruchoma lub segmentowana, albo niezwiązana z porą przyjęcia leku. To samo dla ciemnego moczu z bilirubiną lub krwią w moczu, albo ze wzrostem ALT lub CK w świeżym badaniu. Top-2 p: zostawiam p ≈ 0,6 dla tabletki widmo i p ≈ 0,15 dla zagęszczenia moczu, bo agregat 0,82 / 0,08 jest rozsądny. Pilność bez zmian: 4. Niezbędny element planu: ustalić daty wyników. Jeśli są sprzed ciemnego moczu, w jednej wizycie zlecić z koszyka POZ badanie ogólne moczu, ALT, bilirubinę, kreatyninę z eGFR i CK. Dodatkowo kulka do obejrzenia (zdjęcie lub próbka z opakowaniem Siofor XR), kontrola za 1–2 tygodnie. Dopytać o antykoncepcję: peryndopryl i rosuwastatyna są przeciwwskazane w ciąży.","plik":"04-konsylium.md"},{"kto":"najgorszy_scenariusz","skrot":"Bez zmian (tabletka 0,6, resztki pokarmowe 0,15). Wszyscy 6 lekarzy zgadza się co do tabletki widmo (p ok. 0,6–0,8) i pilności 4. Zmieniłoby zdanie: daty badań sprzed ciemnego moczu (pilność 2), obiekt ruchomy lub członowany, żółtaczka, ból mięśni lub brzucha.","pelny":"Co mnie przekonuje: wszyscy 6 lekarzy zgadza się co do tabletki widmo (p ok. 0,6–0,8) i pilności 4. Zgodny jest też czas, bo w stolcu jest jedna kulka na epizod, a zmiana leku na Siofor XR była kilka miesięcy temu. Zbieżne jest także to, że relacja nie podaje bilirubinurii, krwiomoczu, bólów mięśni ani żółtaczki. Poprawka ordynatora: Co-Prestarium to peryndopryl z amlodypiną, nie indapamid. Tym samym moja flaga \"indapamid\" odpada, ale ACE-I (inhibitor konwertazy angiotensyny) z metforminą przy małej podaży płynów zostaje. Co by zmieniło moje zdanie: daty badań sprzed ciemnego moczu (pilność 2), obiekt ruchomy lub członowany, żółtaczka, ból mięśni lub brzucha. Top-2 p i pilność: bez zmian (tabletka 0,6, resztki pokarmowe 0,15). Weta nie używam, pilność pozostaje 4. Element planu: ustalić daty badań, a gdy są starsze niż objaw, zlecić badanie ogólne moczu z ciężarem właściwym, ALT, bilirubinę, CK i kreatyninę z eGFR. Przy tym zapytać o antykoncepcję.","plik":"04-konsylium.md"},{"kto":"farmakolog","skrot":"Nie zmieniam. Zgodność 4 lekarzy co do tabletki widmo (p 0,82). Zmieniłoby zdanie: kulka miękka, ruchoma albo segmentowana, lub występująca w dni bez metforminy.","pelny":"Co mnie przekonuje: Zgodność 4 lekarzy co do tabletki widmo (p 0,82). Czasowa korelacja z Siofor XR, jedna kulka na dobę i brak objawów brzusznych przemawiają za tym samym. Korekta składu leków (peryndopryl i amlodypina, bez indapamidu) zmienia też moją ocenę ryzyka nerkowego. Nadal oznacza je jednak jako [wiedza modelu, niezweryfikowane]. Co by zmieniło moje zdanie: Kulka miękka, ruchoma albo segmentowana, lub występująca w dni bez metforminy. Ciemny mocz z bilirubinurią, krwią lub podwyższonym CK. Top-2 i pilność: Nie zmieniam. Tabletka widmo to 0,75–0,82, a zagęszczenie moczu to osobny problem. Pilność pozostaje 4. Niezbędny element planu: Ustalić daty badań i eGFR oraz antykoncepcję. Rosuwastatyna i peryndopryl są przeciwwskazane w ciąży, a przy małej podaży płynów trzeba pouczyć o wstrzymaniu metforminy w odwodnieniu.","plik":"04-konsylium.md"},{"kto":"gospodarz_kosztow","skrot":"Nie. Zgodność 4 lekarzy co do tabletki widmo (0,82) i pilności 4. Zmieniłoby zdanie: oględziny kulki, które nie potwierdzają tabletki, uruchamiają badanie kału na pasożyty.","pelny":"Co mnie przekonuje: Zgodność 4 lekarzy co do tabletki widmo (0,82) i pilności 4. Dwa osobne problemy (kulka i barwa moczu) czytane osobno to dobra korekta. Co by zmieniło moje zdanie: Oględziny kulki, które nie potwierdzają tabletki, uruchamiają badanie kału na pasożyty. Pojawienie się bólu brzucha, żółtaczki albo bólów mięśni z ciemnym moczem uruchamia CK, próby wątrobowe i kreatyninę. Zmiana top-2 p i pilności: Nie. Mam p=0 w rozpoznaniu, a pilność zostaje na 4. Czekanie na oględziny jest bezpieczne. Niezbędny element planu: Pierwsze krok to bezkosztowe oględziny kulki, czyli pacjentka przynosi ją albo robi zdjęcie i porównuje z tabletką Siofor XR. Jednocześnie trzeba ustalić daty badań laboratoryjnych i antykoncepcję, bo mają wpływ na decyzję. Bez tych danych badania sprzed ciemnego moczu nie wykluczają cholestazy ani miopatii.","plik":"04-konsylium.md"},{"kto":"ordynator","skrot":"Stanowiska bez zmian: pozostałość tabletki metforminy XR (agregat 0,82); ciemny mocz — osobny problem, najpewniej zagęszczenie.","pelny":"Stanowiska bez zmian: pozostałość tabletki metforminy XR (agregat 0,82); ciemny mocz — osobny problem, najpewniej zagęszczenie. Pilność 4 jednogłośnie, weto niewykorzystane. Flaga „indapamid” odpada (korekta składu Co-Prestarium); zostaje ACE-I + metformina przy małej podaży płynów. Uzgodnione elementy planu: daty badań (jeśli sprzed ciemnego moczu → powtórzyć pakiet), oględziny/zdjęcie kulki z porównaniem do tabletki, antykoncepcja (rosuwastatyna i peryndopryl przeciwwskazane w ciąży), pouczenie o nawodnieniu i wstrzymaniu metforminy w odwodnieniu.","plik":"04-konsylium.md"}]},{"id":"projekt","tytul":"Projekt","czas":"2026-10-31T12:36:50Z","temat":"Ordynator pisze projekt jednej rekomendacji.","wypowiedzi":[{"kto":"ordynator","skrot":"Projekt: Ustal daty dotychczasowych badań i — jeśli pochodzą sprzed ciemnego moczu — zleć w POZ badanie ogólne moczu z ciężarem właściwym, ALT, bilirubinę, CK i kreatyninę z eGFR, a pacjentce wyjaśnij, że kulka to najpewniej pusta matryca tabletki Siofor XR, i poproś o zdjęcie lub przyniesienie następnej razem z opakowaniem leku.","pelny":"REKOMENDACJA: Ustal daty dotychczasowych badań i — jeśli pochodzą sprzed ciemnego moczu — zleć w POZ badanie ogólne moczu z ciężarem właściwym, ALT, bilirubinę, CK i kreatyninę z eGFR, a pacjentce wyjaśnij, że kulka to najpewniej pusta matryca tabletki Siofor XR, i poproś o zdjęcie lub przyniesienie następnej razem z opakowaniem leku. PILNOŚĆ: 4 (planowo) — PEWNOŚĆ: średnia DLACZEGO: Pojedyncza kulka czasowo związana z dawką metforminy o przedłużonym uwalnianiu u pacjentki leczonej od kilku miesięcy to typowy obraz wydalonej matrycy tabletki („ghost tablet”, agregat p=0,82), opisany także dla metforminy XR imitującej pasożyta. Ciemny mocz przy prawidłowym badaniu ogólnym i prawidłowych bilirubinie, ALT, CK i kreatyninie najpewniej wynika z zagęszczenia przy małej podaży płynów. Wykluczenia cholestazy, miopatii statynowej i uszkodzenia nerek są ważne tylko, jeśli badania wykonano w okresie objawu. PLAN B: Jeśli kulka okaże się twarda, warstwowa, ruchoma lub segmentowana albo pojawi się w dni bez metforminy — badanie kału na pasożyty, a przy złogu USG jamy brzusznej. Jeśli świeże badania pokażą bilirubinurię, krew w moczu, CK lub ALT powyżej normy — odstaw rosuwastatynę do wyjaśnienia i pilna kontrola (pilność 2). CZEGO NIE WIEMY: daty badań; wygląd kulki i czy tabletka jest połykana w całości; alkohol, zioła, suplementy; antykoncepcja (rosuwastatyna i peryndopryl są przeciwwskazane w ciąży); HbA1c; RR, BMI, ocena twardówek. Przy małej podaży płynów pacjentka na peryndoprylu i metforminie powinna znać zasadę wstrzymania metforminy przy wymiotach, biegunce lub gorączce. WRÓĆ / ESKALUJ GDY: zażółcenie oczu lub skóry, odbarwiony stolec, mocz koloru coli lub herbaty z bólami lub osłabieniem mięśni, ból brzucha, gorączka, ruchome lub segmentowane obiekty w stolcu, wymioty lub biegunka uniemożliwiające picie. ŹRÓDŁA: K-Sarı I i wsp. Ghost capsules in stool mimicking parasites due to extended release metformin. Clin Lab 2025;71(4). PMID 40209786, DOI 10.7754/Clin.Lab.2024.241019 (PubMed); Iwamuro M i wsp. Ghost tablet in feces. J Gen Fam Med 2017;18(6):483–484. PMID 29264103, DOI 10.1002/jgf2.134 (PubMed); Sun D i wsp. Ghost-Pill-Buster. CNS Drugs 2016;30(5):455–460. PMID 27048352, DOI 10.1007/s40263-016-0332-9 (PubMed); Wardenaar F i wsp. Barwa moczu a nawodnienie. J Athl Train 2022;57(2):191–198. PMID 35201303, DOI 10.4085/1062-6050-0389.21 (PubMed); skład Ezehron Duo i Co-Prestarium, przeciwwskazania w ciąży, zasada wstrzymania metforminy w odwodnieniu [wiedza modelu, niezweryfikowane; brak ChPL w zrodla/]. — Narzędzie testowe i edukacyjne marki MS. Nie służy do podejmowania decyzji u realnych pacjentów.","plik":"05-projekt.md"}]},{"id":"rezydenci","tytul":"Rezydenci","czas":"2026-10-31T12:36:50+00:00","temat":"Rezydenci z zewnątrz robią pre-mortem: znają tylko surowe dane i decyzję.","wypowiedzi":[{"kto":"R1","skrot":"Nikt nie powiedział: miopatia lub rabdomioliza wywołana lekami (rosuvastatyna z ezetymibem) z mioglobinurią i zagrożeniem ostrym uszkodzeniem nerek. Zapytałbym: czy pacjentka ma bóle, osłabienie lub tkliwość mięśni, zwłaszcza po wysiłku?","pelny":"Rezydent R1 Persona: lekarz rodzinny z Wielkiej Brytanii pracujący wg NICE (seed 101) 1. CZEGO BRAKUJE W DANYCH: Czy pacjentka ma bóle, osłabienie lub tkliwość mięśni, zwłaszcza po wysiłku? Czy ciemny mocz pojawił się po zmianie dawki lub rozpoczęciu statyny, albo po wysiłku, gorączce lub odwodnieniu? Czy ma świąd, bóle w prawym podżebrzu lub objawy kamicy żółciowej? Czy badanie ogólne moczu wykonano z testem na krew utajoną i bilirubinę, i kiedy? 2. HIPOTEZA NIEWYPOWIEDZIANA: Miopatia lub rabdomioliza wywołana lekami (rosuvastatyna z ezetymibem) z mioglobinurią i zagrożeniem ostrym uszkodzeniem nerek. Ten mechanizm tłumaczyłby brunatny mocz niezależnie od kulek w stolcu. 3. PODEJRZANE ZAŁOŻENIE: Decyzja zakłada, że kulka to pusta matryca tabletki Siofor XR. Ta hipoteza wyjaśnia stolec, ale zespół mógł uznać ją za wyjaśnienie całego obrazu. Pilność 4 przy brunatnym moczu utrzymującym się od paru miesięcy na statynie wygląda na nawyk \"poczekaj na dane\". Dodatkowo kilka odpowiedzi z [B] (\"Brak.\", \"Tak.\", \"Nic nie zmieniano.\") jest niezrozumiałych bez pytań.","plik":"06-rezydenci/R1.md","persona":"lekarz rodzinny z Wielkiej Brytanii pracujący wg NICE"},{"kto":"R2","skrot":"Nikt nie powiedział: pasożyt przewodu pokarmowego, np. wyprysk glisty lub kokcydia, czyli zakażenie pasożytnicze z ciemnym moczem jako zdarzeniem niezależnym, np. hemoliza lub rabdomioliza w innym mechanizmie niż lek. Zapytałbym: czy pacjentka kiedykolwiek była za granicą, w strefie tropikalnej lub subtropikalnej, jadła surowe ryby, wodne rośliny albo niedogotowane mięso?","pelny":"Rezydent R2 Persona: lekarz chorób zakaźnych (seed 202) 1. CZEGO BRAKUJE W DANYCH: Czy pacjentka kiedykolwiek była za granicą, w strefie tropikalnej lub subtropikalnej, jadła surowe ryby, wodne rośliny albo niedogotowane mięso? Czy ma świąd odbytu, ból brzucha, biegunkę, gorączkę, eozynofilię lub utratę masy ciała? Kulki widziała dwa razy, ale nikt nie zapytał, czy mają strukturę ziarnistą, czy są miękkie i rozpadają się w palcach, ani ile ich było w każdym epizodzie. 2. HIPOTEZA NIEWYPOWIEDZIANA: Pasożyt przewodu pokarmowego, np. wyprysk glisty lub kokcydia, czyli zakażenie pasożytnicze z ciemnym moczem jako zdarzeniem niezależnym, np. hemoliza lub rabdomioliza w innym mechanizmie niż lek. 3. PODEJRZANE ZAŁOŻENIE: Zespół przyjmuje, że kulka to matryca tabletki Siofor XR, mimo że w [B] jest „jedna kulka, raczej powiązana czasowo\", a Siofor XR to tabletka, nie kuleczki. Nie sprawdzono kształtu ani składu stolca. Odpowiedzi w [B] są niezrozumiałe bez pytań, np. punkty 2, 3, 5, 10 i 11 nie wskazują, czego dotyczą.","plik":"06-rezydenci/R2.md","persona":"lekarz chorób zakaźnych"}]},{"id":"sprawdzenie","tytul":"Sprawdzenie","czas":"2026-10-31T12:39:26Z","temat":"Sprawdzający weryfikują fakty i proces. Nie głosują nad rozpoznaniem.","wypowiedzi":[{"kto":"s_fakty","skrot":"Kartka żółta. Sprawdzający nie miał PubMed (chwilowy błąd połączenia); ordynator zweryfikował wszystkie PMID/DOI w PubMed po pętli: 40209786, 29264103, 27048352, 35201303, 36873007, 38021975, 34987920 — wszystkie poprawne. ACE-I w ciąży: przeciwwskazane w II–III trymestrze, niezalecane w I — poprawione w FINAL.","pelny":"Sprawdzający nie miał PubMed (chwilowy błąd połączenia); ordynator zweryfikował wszystkie PMID/DOI w PubMed po pętli: 40209786, 29264103, 27048352, 35201303, 36873007, 38021975, 34987920 — wszystkie poprawne. ACE-I w ciąży: przeciwwskazane w II–III trymestrze, niezalecane w I — poprawione w FINAL. Odstawienie rosuwastatyny w PLAN B wymaga etykiety — dodana. Tytuł K-Sarı mówi o 'ghost capsules' — poprawione w cytacie.","plik":"07-sprawdzenie.json","kartka":"ZOLTA"},{"kto":"s_proces","skrot":"Kartka czerwona. REKOMENDACJA z 4 działaniami i słowem 'lub' — poprawione w FINAL (jedno działanie). Brak porfirii w WRÓĆ — dopisana.","pelny":"REKOMENDACJA z 4 działaniami i słowem 'lub' — poprawione w FINAL (jedno działanie). Brak porfirii w WRÓĆ — dopisana. NIEZNANE niepełne (alergie, co pacjentka uważa, od kiedy cukrzyca) — dopisane. Ślepa tura bez przecieku hipotezy (osobny plik). Log: 7 pakietów przy 2 rezydentach (użyte seedy 101 i 202).","plik":"07-sprawdzenie.json","kartka":"CZERWONA"}]},{"id":"odpowiedz","tytul":"Odpowiedź rezydentom","czas":"2026-10-31T12:39:26Z","temat":"Ordynator odpowiada jawnie na każdą uwagę rezydentów: przyjmuję albo odrzucam.","wypowiedzi":[{"kto":"ordynator","skrot":"Przyjmuję 5, odrzucam 2. Pilność bez zmian (4).","pelny":"08 — Odpowiedź ordynatora rezydentom R1 (lekarz rodzinny, NICE) 1. Bóle/tkliwość mięśni, wysiłek, związek ze statyną, świąd, test paskowy na krew i bilirubinę z datą — PRZYJMUJĘ częściowo: o mięśnie, świąd i ból pytano (tura 2: brak); data badania i wynik paska na krew pozostają NIEZNANE → już w REKOMENDACJI (powtórzenie w dniu ciemnego moczu). Kategoria: brak_danych. Hasło: data-badan. 2. Miopatia statynowa z mioglobinurią — ODRZUCAM jako zmianę decyzji: CK i badanie ogólne moczu prawidłowe, brak bólów mięśni; mioglobinuria dałaby dodatni pasek na krew [wiedza modelu, niezweryfikowane]. Zostaje w PLAN B i WRÓĆ (mocz koloru coli + mięśnie). Kategoria: hipoteza. Hasło: miopatia-statynowa. 3. Pilność 4 przy „brunatnym moczu od paru miesięcy” — ODRZUCAM: „od paru miesięcy” dotyczyło Siofor XR, mocz był ciemny „rzadko”. PRZYJMUJĘ uwagę o odpowiedziach bez pytań — to ten sam błąd pakietu co w sprawie 01 (rezydent źle przypisał odpowiedź). Kategoria: zalozenie. Hasło: pakiet-bez-pytan. R2 (lekarz chorób zakaźnych) 1. Podróże, surowe ryby/mięso, świąd odbytu, eozynofilia; struktura kulki — PRZYJMUJĘ: podróże i dieta do CZEGO NIE WIEMY; morfologia z rozmazem (eozynofilia) dopisana do badań. Kategoria: brak_danych. Hasło: wywiad-epidemiologiczny. 2. Pasożyt jelitowy — PRZYJMUJĘ bez zmiany decyzji: jest w PLAN B (kał na pasożyty, gdy kulka nie przypomina tabletki). Kategoria: hipoteza. Hasło: pasozyt. 3. „Siofor XR to tabletka, a nie kuleczka” — PRZYJMUJĘ, obniża pewność: Siofor XR 1000 mg to duża podłużna tabletka [wiedza modelu, niezweryfikowane], a pacjentka opisała „małe okrągłe kuleczki”. Matryca może się zmieniać w przewodzie pokarmowym, ale niezgodność kształtu jest realna; oględziny porównawcze stają się warunkiem rozpoznania (PLAN B). W opisanym przypadku metforminy XR obiekt był żółtawy i imitował pasożyta (PMID 40209786). Kategoria: zalozenie. Hasło: ksztalt-kulki. Zmiana decyzji Pilność bez zmian (4). Dodane: morfologia z rozmazem; wywiad podróży i diety; oględziny kulki jako warunek potwierdzenia.","plik":"08-odpowiedz-rezydentom.md"}]},{"id":"final","tytul":"Werdykt","czas":"2026-10-31T12:39:26Z","temat":"Jedna rekomendacja. Pilność 4, pewność średnia.","wypowiedzi":[{"kto":"ordynator","skrot":"Zleć z koszyka POZ, z pobraniem w dniu ciemnego moczu, badanie ogólne moczu z ciężarem właściwym, morfologię z rozmazem, ALT, bilirubinę, CK i kreatyninę z eGFR.","pelny":"REKOMENDACJA: Zleć z koszyka POZ, z pobraniem w dniu ciemnego moczu, badanie ogólne moczu z ciężarem właściwym, morfologię z rozmazem, ALT, bilirubinę, CK i kreatyninę z eGFR. PILNOŚĆ: 4 (planowo) — PEWNOŚĆ: średnia DLACZEGO: Kulka czasowo związana z dawką metforminy o przedłużonym uwalnianiu to najpewniej wydalona matryca tabletki („ghost tablet”, agregat p=0,82); opisano przypadek żółtawej, „pasożytopodobnej” struktury w stolcu po metforminie XR (PMID 40209786), ale opis „małej okrągłej kuleczki” nie pasuje do dużej podłużnej tabletki Siofor XR, więc bez oględzin to nie jest pewne. Ciemny mocz przy prawidłowym badaniu ogólnym, bilirubinie, CK i kreatyninie najpewniej wynika z zagęszczenia przy małej podaży płynów (PMID 35201303), ale te wykluczenia są ważne tylko, jeśli badania pochodzą z okresu objawu — stąd powtórzenie w dniu ciemnego moczu. PLAN B: Jeśli pojawi się kolejna kulka — pacjentka ją zachowuje i przynosi z tabletką Siofor XR do porównania; jeśli nie przypomina matrycy tabletki  * Moduł działa w ramce powłoki i nie ma dostępu do dysku. O operacje na plikach w „folderze
 * Konsylium” prosi powłokę przez postMessage; powłoka przekazuje je do procesu głównego, który
 * pilnuje, żeby nic nie wyszło poza ten folder. Poza powłoką (zwykła przeglądarka, podgląd w Claude)
 * MsMost.dostepny() zwraca false i moduł działa jak dotąd.
 */
(function (root) {
  'use strict';
  var czeka = {}, licznik = 0;
  var wRamce = false;
  try { wRamce = root.parent && root.parent !== root; } catch (e) { wRamce = false; }
  var sluchacze = [];
  root.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || e.source !== root.parent) return;
    if (d.typ === 'ms-most-odp') {
      var p = czeka[d.id]; if (!p) return; delete czeka[d.id];
      if (d.blad) p.zle(new Error(d.blad)); else p.ok(d.wynik);
    } else if (d.typ === 'ms-dane') {
      sluchacze.forEach(function (f) { try { f(d.od, d.dane); } catch (err) { /* słuchacz modułu */ } });
    }
  });
  function wywolaj(op, args, limit) {
    return new Promise(function (ok, zle) {
      if (!wRamce) { zle(new Error('Poza aplikacją MS Konsylium Narzędzia.')); return; }
      var id = ++licznik; czeka[id] = { ok: ok, zle: zle };
      root.parent.postMessage({ typ: 'ms-most', id: id, op: op, args: args || [] }, '*');
      setTimeout(function () { if (czeka[id]) { delete czeka[id]; zle(new Error('Powłoka nie odpowiada.')); } }, limit || 15000);
    });
  }
  var dostep = null;
  root.MsMost = {
    // true, gdy moduł działa w powłoce z obsługą plików (sprawdzane raz)
    dostepny: function () {
      if (!dostep) dostep = wywolaj('ping', [], 1200).then(function (w) { return w === 'ms-powloka-1'; }, function () { return false; });
      return dostep;
    },
    folder: function () { return wywolaj('folder'); },
    wybierzFolder: function () { return wywolaj('wybierzFolder', [], 600000); },
    czytaj: function (p) { return wywolaj('czytaj', [p]); },
    zapisz: function (p, t) { return wywolaj('zapisz', [p, t]); },
    lista: function (p) { return wywolaj('lista', [p || '']); },
    czytajFolder: function (p) { return wywolaj('czytajFolder', [p || '']); },
    // przełącza powłokę na inny moduł (np. anonimizator z ekranu wywiadu)
    otworzModul: function (m) { return wywolaj('otworzModul', [m]); },
    // przekazuje dane innemu modułowi (np. zanonimizowane wyniki do wywiadu)
    wyslij: function (doModulu, dane) { return wywolaj('wyslij', [doModulu, dane]); },
    naDane: function (f) { sluchacze.push(f); }
  };
})(typeof window !== 'undefined' ? window : this);

// Pokój lekarski — postacie lekarzy (wątek Graficzny, 1.11.2026, makieta grafika/makiety-2026-11-01/makieta-1.png).
// Michał: postacie białej rasy, kobiety i mężczyźni; ordynator gruby, pali widoczną fajkę; większe twarze, ruch ust przy dymku.
// postacSVG(id, grupa, kolor) zwraca wnętrze <g class="ciało"> w układzie figury: stopy w (0,0), głowa ok. -150.
// Stałe klasy, na których opiera się logika pokoju: .papieros.fajka i .zar (dym ordynatora wychodzi z (28.5,-104)).
const POSTACIE_SKORA = ['#F3D5C0', '#EFCBB2', '#F6DDCB', '#EAC3A6'];
// fryzura: lysy | krotkie | siwe | przedzial | bob | kucyk | loki | kok
const POSTACIE_WYGLAD = {
  ordynator:            { gruby: 1, fryzura: 'lysy', wlosy: '#b9b4ad', broda: '#cfcac3', okulary: 1, fajka: 1 },
  hipotezujacy:         { fryzura: 'krotkie', wlosy: '#5b3a24' },
  bayes:                { fryzura: 'bob', wlosy: '#2f2a26', okulary: 1, skora: 2 },
  farmakolog:           { fryzura: 'kucyk', wlosy: '#c08a4a', skora: 1 },
  najgorszy_scenariusz: { fryzura: 'siwe', wlosy: '#8f8a84', broda: '#8f8a84', skora: 3 },
  poz_pragmatyk:        { fryzura: 'loki', wlosy: '#9b3e22', skora: 2 },
  gospodarz_kosztow:    { fryzura: 'przedzial', wlosy: '#d8b46a', okulary: 1 },
  lekarz_prowadzacy:    { fryzura: 'kok', wlosy: '#4a3428', teczka: 1 },
  z_zlozonosc:          { fryzura: 'krotkie', wlosy: '#3a2a20', broda: '#3a2a20' },
  z_bezpieczenstwo:     { fryzura: 'kucyk', wlosy: '#2f2a26', skora: 1 },
  z_niepewnosc:         { fryzura: 'siwe', wlosy: '#a9a39b', okulary: 1, skora: 3 },
  s_fakty:              { fryzura: 'przedzial', wlosy: '#6b4a33', okulary: 1 },
  s_proces:             { fryzura: 'bob', wlosy: '#d8b46a', skora: 2 },
  R1:                   { fryzura: 'krotkie', wlosy: '#c08a4a' },
  R2:                   { fryzura: 'kok', wlosy: '#5b3a24', skora: 2 },
  R3:                   { fryzura: 'krotkie', wlosy: '#2f2a26', okulary: 1, skora: 1 },
};
const POSTACIE_SKALA = 0.76; // rysunek w jednostkach makiety (≈196 wysokości) → skala sceny (≈150)

function postacSVG(id, grupa, kolor) {
  const o = POSTACIE_WYGLAD[id] || { fryzura: 'krotkie', wlosy: '#5b3a24' };
  const sk = POSTACIE_SKORA[o.skora || 0], w = o.wlosy, g = o.gruby ? 1.45 : 1;
  const rezydent = grupa === 'rezydent';
  const fartuch = rezydent ? kolor : 'var(--fartuch)', obrys = 'var(--fartuch-cien)';
  const bw = 30 * g, hy = -166;
  let h = `<g transform="scale(${POSTACIE_SKALA})">`;
  // nogi i buty
  h += `<rect x="-15" y="-52" width="12" height="52" rx="5" fill="${rezydent ? '#3a3f4a' : '#2f4744'}"/><rect x="3" y="-52" width="12" height="52" rx="5" fill="${rezydent ? '#3a3f4a' : '#2f4744'}"/>`;
  h += `<ellipse cx="-10" cy="-1" rx="10" ry="5" fill="#1d2b2a"/><ellipse cx="10" cy="-1" rx="10" ry="5" fill="#1d2b2a"/>`;
  // fartuch (ordynator: szerszy, z brzuchem)
  h += `<path d="M${-bw} -50 Q${-bw - 4} -110 ${-bw * 0.62} -128 L${bw * 0.62} -128 Q${bw + 4} -110 ${bw} -50 Q0 -42 ${-bw} -50Z" fill="${fartuch}" stroke="${obrys}" stroke-width="1.5"/>`;
  if (o.gruby) h += `<path d="M${-bw + 6} -66 Q0 -40 ${bw - 6} -66" fill="none" stroke="${obrys}" stroke-width="1.4"/>`;
  // koszula w kolorze roli i klapy
  h += `<path d="M-10 -128 L0 -100 L10 -128Z" fill="${rezydent ? '#e8e2d6' : kolor}"/>`;
  h += `<path d="M-11 -128 L-2 -96 L-14 -80 M11 -128 L2 -96 L14 -80" stroke="${obrys}" stroke-width="1.6" fill="none"/>`;
  // lewa ręka
  h += `<path d="M${-bw * 0.75} -122 Q${-bw - 14} -95 ${-bw - 6} -66" stroke="${fartuch}" stroke-width="13" stroke-linecap="round" fill="none"/>`;
  h += `<circle cx="${-bw - 6}" cy="-62" r="6.5" fill="${sk}"/>`;
  // prawa ręka: przy fajce, z teczką albo luźno
  if (o.fajka) {
    h += `<path d="M${bw * 0.75} -122 Q${bw + 14} -104 ${bw * 0.8} -112" stroke="${fartuch}" stroke-width="13" stroke-linecap="round" fill="none"/>`;
  } else {
    h += `<path d="M${bw * 0.75} -122 Q${bw + 14} -95 ${bw + 6} -66" stroke="${fartuch}" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="${bw + 6}" cy="-62" r="6.5" fill="${sk}"/>`;
    if (o.teczka) h += `<rect x="${bw - 6}" y="-74" width="30" height="38" rx="3" fill="#d9a84e" stroke="#a87b2c" stroke-width="1.5"/><rect x="${bw + 1}" y="-80" width="16" height="7" rx="2" fill="#a87b2c"/>`;
  }
  // stetoskop (lekarze i ordynator), identyfikator w kolorze roli
  if (grupa === 'lekarz' || grupa === 'ordynator' || grupa === 'prowadzacy') h += `<path d="M-8 -126 Q-16 -96 -2 -88 Q12 -96 8 -126" stroke="#3b5552" stroke-width="2.4" fill="none"/><circle cx="-2" cy="-86" r="4" fill="#9fb2af" stroke="#3b5552" stroke-width="1.6"/>`;
  h += rezydent
    ? `<rect x="${bw * 0.22}" y="-116" width="13" height="16" rx="2" fill="#fff"/><rect x="${bw * 0.22}" y="-116" width="13" height="5" rx="1" fill="${kolor}"/>`
    : `<rect x="${bw * 0.25}" y="-112" width="13" height="9" rx="2" fill="${kolor}"/>`;
  // szyja
  h += `<rect x="-6" y="-140" width="12" height="14" fill="${sk}"/>`;
  // włosy z tyłu
  if (o.fryzura === 'kucyk') h += `<path d="M18 ${hy - 6} Q40 ${hy + 6} 30 ${hy + 34} Q22 ${hy + 20} 16 ${hy + 8}Z" fill="${w}"/>`;
  if (o.fryzura === 'bob') h += `<path d="M-27 ${hy - 4} Q-30 ${hy + 26} -20 ${hy + 30} L20 ${hy + 30} Q30 ${hy + 26} 27 ${hy - 4}Z" fill="${w}"/>`;
  if (o.fryzura === 'loki') h += `<g fill="${w}">${[-26, -18, -8, 4, 14, 22, 27, -28, 28].map((dx, i) => `<circle cx="${dx}" cy="${hy + (i > 6 ? 14 : -14 + Math.abs(dx) / 3)}" r="11"/>`).join('')}</g>`;
  if (o.fryzura === 'kok') h += `<circle cx="0" cy="${hy - 30}" r="11" fill="${w}"/>`;
  // uszy, twarz, policzki
  h += `<ellipse cx="-24" cy="${hy + 2}" rx="5" ry="7" fill="${sk}"/><ellipse cx="24" cy="${hy + 2}" rx="5" ry="7" fill="${sk}"/>`;
  h += `<ellipse cx="0" cy="${hy}" rx="${o.gruby ? 26 : 23}" ry="26" fill="${sk}"/>`;
  h += `<ellipse cx="-13" cy="${hy + 8}" rx="5" ry="3" fill="#e9a99a" opacity=".45"/><ellipse cx="13" cy="${hy + 8}" rx="5" ry="3" fill="#e9a99a" opacity=".45"/>`;
  // włosy z przodu
  if (o.fryzura === 'lysy') h += `<path d="M-24 ${hy - 2} Q-25 ${hy - 14} -19 ${hy - 10} M24 ${hy - 2} Q25 ${hy - 14} 19 ${hy - 10}" stroke="${w}" stroke-width="7" stroke-linecap="round"/>`;
  else if (o.fryzura === 'krotkie' || o.fryzura === 'siwe') h += `<path d="M-24 ${hy - 2} Q-26 ${hy - 30} 0 ${hy - 29} Q26 ${hy - 30} 24 ${hy - 2} Q16 ${hy - 18} -4 ${hy - 17} Q-18 ${hy - 16} -24 ${hy - 2}Z" fill="${w}"/>`;
  else if (o.fryzura === 'przedzial') h += `<path d="M-24 ${hy} Q-27 ${hy - 30} 2 ${hy - 30} Q27 ${hy - 28} 24 ${hy} Q20 ${hy - 14} 8 ${hy - 20} Q-6 ${hy - 12} -24 ${hy}Z" fill="${w}"/>`;
  else h += `<path d="M-25 ${hy + 4} Q-28 ${hy - 32} 0 ${hy - 30} Q28 ${hy - 32} 25 ${hy + 4} Q22 ${hy - 14} 6 ${hy - 18} Q-10 ${hy - 12} -25 ${hy + 4}Z" fill="${w}"/>`;
  // oczy, brwi, okulary, nos
  h += `<ellipse cx="-9" cy="${hy + 1}" rx="2.6" ry="3.2" fill="#24302f"/><ellipse cx="9" cy="${hy + 1}" rx="2.6" ry="3.2" fill="#24302f"/>`;
  h += `<path d="M-14 ${hy - 7} Q-9 ${hy - 10} -4 ${hy - 7} M4 ${hy - 7} Q9 ${hy - 10} 14 ${hy - 7}" stroke="${o.fryzura === 'lysy' ? '#9a9a9a' : w}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if (o.okulary) h += `<g stroke="#2e3d3b" stroke-width="1.8" fill="rgba(255,255,255,.25)"><circle cx="-9" cy="${hy + 1}" r="7"/><circle cx="9" cy="${hy + 1}" r="7"/><path d="M-2 ${hy + 1} L2 ${hy + 1}"/></g>`;
  h += `<path d="M0 ${hy + 3} Q3 ${hy + 9} -1 ${hy + 10}" stroke="#c99c82" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  if (o.broda) h += `<path d="M-21 ${hy + 6} Q-20 ${hy + 30} 0 ${hy + 32} Q20 ${hy + 30} 21 ${hy + 6} Q14 ${hy + 20} 0 ${hy + 19} Q-14 ${hy + 20} -21 ${hy + 6}Z" fill="${o.broda}"/>`;
  // usta: zamknięte i otwarte – przy dymku CSS przełącza je na zmianę (.postac.aktywna)
  h += `<g class="usta"><path class="u-zam" d="M-5 ${hy + 15} Q0 ${hy + 19} 5 ${hy + 15}" stroke="#8a3d38" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse class="u-otw" cx="0" cy="${hy + 16}" rx="4.6" ry="3.8" fill="#8a3d38"/></g>`;
  h += `</g>`;
  // fajka ordynatora w skali sceny: wygięta, cybuch dokładnie w (28.5,-104), skąd wychodzi dym
  if (o.fajka) {
    const s = POSTACIE_SKALA;
    h += `<g class="papieros fajka"><path d="M${3 * s} ${(hy + 15) * s} Q${16} ${(hy + 26) * s} ${24} ${-108}" fill="none" stroke="#3a2416" stroke-width="3" stroke-linecap="round"/>` +
      `<path d="M21 -104 L36 -104 L34.5 -89 Q28.5 -84 22.5 -89Z" fill="#7a4524" stroke="#3a2416" stroke-width="1.3"/>` +
      `<ellipse cx="28.5" cy="-104" rx="7.5" ry="2.4" fill="#2a1a10"/><circle class="zar" cx="28.5" cy="-104" r="2.6" fill="#e8742a"/>` +
      `<circle cx="${bw * 0.8 * s + 1}" cy="${-112 * s + 1}" r="5" fill="${sk}"/></g>`;
  }
  return h;
}

// Plakat na ścianie Pokoju: realistyczny rysunek pastelowy nieogolonego diagnosty z laską i serduszkiem
// (żartobliwy hołd dla serialowego lekarza; rysunek autorski, bez zdjęć, bez nazwisk aktorów).
// Technika: kolorowy papier z ziarnem, miękkie plamy pigmentu (rozmycie), kreski pastelu, chropowate brzegi
// (feDisplacementMap) i „ząbek” papieru prześwitujący przez pigment. Układ współrzędnych: 200 × 250.
// PLAKAT_SZKIC to szkic wektorowy; zasoby/maluj-plakat.py przemalowuje go kreskami pastelu do zasoby/plakat.jpg
// (zasoby/README.md). W scenie jest obraz (PLAKAT_DEFS, osadzony przez build.mjs jako data:), napis i serce do cmoknięcia.
const PLAKAT_W = 200, PLAKAT_H = 250;

function plKreski(n, x0, y0, x1, y1, dx, dy, kolor, gr, op, seed) {
  // n równoległych kresek pastelu z lekkim rozrzutem (deterministyczny, żeby rysunek był zawsze ten sam)
  let s = seed, out = '';
  const los = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let k = 0; k < n; k++) {
    const t = k / Math.max(1, n - 1), x = x0 + (x1 - x0) * t + (los() - .5) * 3, y = y0 + (y1 - y0) * t + (los() - .5) * 3;
    const l = .7 + los() * .6;
    out += `<path d="M${x.toFixed(1)},${y.toFixed(1)} q${(dx * l / 2 + (los() - .5) * 2).toFixed(1)},${(dy * l / 2 + (los() - .5) * 2).toFixed(1)} ${(dx * l).toFixed(1)},${(dy * l).toFixed(1)}"/>`;
  }
  return `<g fill="none" stroke="${kolor}" stroke-width="${gr}" stroke-linecap="round" opacity="${op}">${out}</g>`;
}

function plWlosy() {
  // krótkie, potargane, siwiejące włosy: kreski od linii czoła ku górze i na boki
  let s = 11, out = '';
  const los = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const kol = ['#5b4a3f', '#7a6a5e', '#9c9088', '#3e322b', '#b7aea6'];
  for (let k = 0; k < 220; k++) {
    const a = Math.PI * (1.08 + los() * .84), r = 18 + los() * 13;
    const x = 100 + Math.cos(a) * r * 1.12, y = 80 + Math.sin(a) * r * 1.05;
    const dl = 3 + los() * 4, kat = a + Math.PI / 2 * (los() < .5 ? 1 : -1) + (los() - .5) * .9;
    out += `<path d="M${x.toFixed(1)},${y.toFixed(1)} l${(Math.cos(kat) * dl).toFixed(1)},${(Math.sin(kat) * dl).toFixed(1)}" stroke="${kol[k % kol.length]}"/>`;
  }
  return `<g fill="none" stroke-width=".9" stroke-linecap="round" opacity=".75">${out}</g>`;
}

// Pokój lekarski — rysuje pokój (SVG), sadza członków konsylium i odtwarza scenariusz w dymkach.
// Wymaga: zbudujScenariusz, ROLE (z scenariusz.mjs, wklejone przez build) i DEMO (scenariusz osadzony przy budowie).
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const W = 1200, H = 700;
  const KOLOR = { ordynator: 'var(--g-ordynator)', lekarz: 'var(--g-lekarz)', zastepca: 'var(--g-zastepca)', sprawdzajacy: 'var(--g-sprawdzajacy)', rezydent: 'var(--g-rezydent)', prowadzacy: 'var(--g-prowadzacy)' };
  // postacie białej rasy, kobiety i mężczyźni (Michał 1.11): jasne odcienie skóry; fryzury 1, 3, 5 kobiece, 0, 2, 4 męskie
  const SKORA = ['#f3d9c4', '#ecc9ad', '#f6e1cf', '#e9c4a6', '#f1d2b9', '#e6bf9f'];
  const WLOSY = ['#2b211c', '#5a3b26', '#9b9590', '#1d1d22', '#7a4b2a', '#c9a46a'];
  const KOBIETA = (f) => f % 2 === 1;

  // miejsca: x, y stóp, skala, warstwa (0 = za stołem, 1 = przed stołem), fryzura, okulary
  const MIEJSCA = {
    ordynator:            { x: 600, y: 440, s: 1.04, w: 0, f: 2, o: true },
    hipotezujacy:         { x: 440, y: 452, s: .95, w: 0, f: 1 },
    bayes:                { x: 760, y: 452, s: .95, w: 0, f: 0, o: true },
    najgorszy_scenariusz: { x: 262, y: 566, s: 1.02, w: 1, f: 3 },
    poz_pragmatyk:        { x: 938, y: 566, s: 1.02, w: 1, f: 4 },
    farmakolog:           { x: 470, y: 668, s: 1.05, w: 1, f: 5 },
    gospodarz_kosztow:    { x: 730, y: 668, s: 1.05, w: 1, f: 2 },
    z_zlozonosc:          { x: 214, y: 392, s: .78, w: 0, f: 3 },
    z_bezpieczenstwo:     { x: 274, y: 388, s: .78, w: 0, f: 0 },
    z_niepewnosc:         { x: 334, y: 392, s: .78, w: 0, f: 1, o: true },
    s_fakty:              { x: 1058, y: 444, s: .8, w: 0, f: 4, o: true },
    s_proces:             { x: 1138, y: 444, s: .8, w: 0, f: 5 },
    // lekarz prowadzący (użytkownik aplikacji) — stoi z prawej przed stołem, pisze z paska pod sceną
    lekarz_prowadzacy:    { x: 1040, y: 672, s: 1.05, w: 1, f: 0 },
  };
  const MIEJSCA_REZ = { 1: [[100]], 2: [[72], [130]], 3: [[58], [100], [142]] };

  let scen = null, kroki = [], i = 0, gra = false, timer = null, tempo = 1, szczegolKto = null;

  // ---------- rysunek pokoju ----------
  function figura(id, m, rola) {
    // rysunek postaci: src/postacie.js (wątek Graficzny 1.11 – kobiety i mężczyźni, większe twarze, ruch ust, ordynator z fajką)
    const g = rola.grupa, kol = KOLOR[g], s = m.s;
    return `
<g class="postac" data-kto="${id}" tabindex="0" role="button" aria-label="${esc(rola.nazwa)}" transform="translate(${m.x},${m.y}) scale(${s})" style="--g:${kol}">
  <ellipse cx="0" cy="0" rx="${g === 'ordynator' ? 40 : 30}" ry="7" fill="var(--cien-postaci)"/>
  <ellipse class="halo" cx="0" cy="0" rx="${g === 'ordynator' ? 46 : 38}" ry="10" fill="none" stroke="var(--petrol)" stroke-width="3"/>
  <g class="ciało">${postacSVG(id, g, kol)}</g>
</g>`;
  }

  function podpisy(widoczne) {
    return widoczne.map(([id, m]) => {
      const r = ROLE[id]; if (!r) return '';
      const KROTKO = { z_zlozonosc: 'złożoność', z_bezpieczenstwo: 'bezpieczeństwo', z_niepewnosc: 'niepewność', s_fakty: 'fakty', s_proces: 'proces' };
      const nazwa = r.grupa === 'rezydent' ? r.inicjaly : (KROTKO[id] || r.nazwa);
      const maly = r.grupa === 'zastepca' || r.grupa === 'sprawdzajacy' || r.grupa === 'rezydent';
      const y = m.y + 18 * m.s + (id === 'z_bezpieczenstwo' ? 11 : 0) + (r.grupa === 'sprawdzajacy' ? 32 : 0);
      return `<text class="${maly ? 'podpis podpis-maly' : 'podpis'}" x="${m.x}" y="${y}" text-anchor="middle">${esc(nazwa)}</text>`;
    }).join('');
  }

  function rysujPokoj() {
    const lr = Math.max(1, Math.min(3, scen?.tablica?.liczbaRezydentow || ileRezydentow()));
    const miejsca = { ...MIEJSCA };
    MIEJSCA_REZ[lr].forEach(([x], k) => { miejsca['R' + (k + 1)] = { x, y: 318, s: lr === 3 ? .6 : .66, w: -1, f: k + 2 }; });
    const wpisy = Object.entries(miejsca).filter(([id]) => ROLE[id]);

    // podłoga w perspektywie
    let podloga = '';
    for (let k = -12; k <= 12; k++) podloga += `<line x1="${600 + k * 22}" y1="338" x2="${600 + k * 140}" y2="700" stroke="var(--podloga-linia)" stroke-width="1.5"/>`;
    for (const y of [360, 392, 436, 494, 566, 652]) podloga += `<line x1="0" y1="${y}" x2="1200" y2="${y}" stroke="var(--podloga-linia)" stroke-width="1.5"/>`;
    let gwiazdy = '';
    [[905, 92], [960, 130], [1010, 84], [1080, 118], [1125, 96], [930, 190], [1050, 170], [1110, 210]].forEach(([x, y]) => { gwiazdy += `<circle cx="${x}" cy="${y}" r="1.6" fill="var(--okno-gwiazda)"/>`; });

    const zaStolem = wpisy.filter(([, m]) => m.w === 0).map(([id, m]) => figura(id, m, ROLE[id])).join('');
    const przedStolem = wpisy.filter(([, m]) => m.w === 1).map(([id, m]) => figura(id, m, ROLE[id])).join('');
    const rezydenci = wpisy.filter(([, m]) => m.w === -1).map(([id, m]) => figura(id, m, ROLE[id])).join('');

    $('rys').innerHTML = `
<rect x="0" y="0" width="${W}" height="338" fill="var(--sciana)"/>
${[180, 360, 840, 1020].map((x) => `<rect x="${x}" y="0" width="2" height="330" fill="var(--sciana-2)"/>`).join('')}
<polygon points="0,338 1200,338 1200,700 0,700" fill="var(--podloga)"/>
${podloga}
<rect x="0" y="328" width="${W}" height="10" fill="var(--listwa)"/>

<!-- okno -->
<rect x="876" y="56" width="280" height="200" rx="10" fill="var(--listwa)"/>
<rect x="886" y="66" width="260" height="180" rx="5" fill="var(--okno-niebo)"/>${gwiazdy}
<circle cx="1100" cy="104" r="14" fill="var(--okno-gwiazda)"/>
<rect x="1013" y="66" width="6" height="180" fill="var(--listwa)"/><rect x="886" y="153" width="260" height="6" fill="var(--listwa)"/>
<rect x="870" y="250" width="292" height="9" rx="3" fill="var(--listwa)"/>

  // ---------- czas ----------
  function hhmm(ts) {
    if (!ts) return '';
    const d = new Date(ts); if (isNaN(d)) return '';

  function ustawZegar(ts) {
    const d = ts ? new Date(ts) : null;
    if (!d || isNaN(d)) return;
    let h = d.getUTCHours(), m = d.getUTCMinutes();
    try { const [hh, mm] = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Warsaw' }).split(':'); h = +hh; m = +mm; } catch { /* zostaje UTC */ }

  // ---------- odtwarzanie ----------
  // tryb na żywo: nowy scenariusz tej samej sprawy bez cofania odtwarzania
  // ---------- wnioski końcowe ----------
  let wnioskiPokazane = '';
  function rysujWnioski(s, otworz) {
    const w = s && s.wnioski, btn = $('wnioski-btn'), el = $('wnioski');
    // zmiana sprawy: poprzednie wnioski znikają, a nowe mogą otworzyć się same

      if (zywoTimer && naKoncu && !gra) ustawGre(true); // na żywo: nowe wypowiedzi odtwarzają się same
    };
    if (przerwa) zakonczPrzerwe(dalej); else dalej(); // lekarze wracają z narady z gotową wypowiedzią
  }

  function przygotuj(s) {

    rysujPokoj(); rysujListe(); rysujLegende();

  // W aplikacji liczy się dyskusja i wnioski (Michał 31.10): etapy techniczne (wywiad, triage, ślepa tura,
  // agregacja) przelatują szybko, a dyskusja idzie w tempie do czytania.

  const pierwszyDyskusji = (od = 0) => { for (let j = Math.max(0, od); j < kroki.length; j++) if (!techniczny(kroki[j])) return j; return -1; };
  function czasKroku(k) {

    return (2400 + (w.tresc || w.skrot).length * 34 + (w.info ? 1200 : 0)) / tempo;
  }

  function pokaz(n, bezPisania) {

    if (akt) { const l = $('lista'); const top = akt.offsetTop - l.offsetTop - l.clientHeight / 2; l.scrollTo({ top, behavior: ruch ? 'smooth' : 'auto' }); }

  function ustawDymek(d, kto) {
    const m = MIEJSCA_AKT[kto]; if (!m) return;
    const pokoj = $('pokoj'), Wp = pokoj.clientWidth, Hp = pokoj.clientHeight;

  }

  function zaplanuj() {
    clearTimeout(timer);
    if (!gra) return;

      if (i >= kroki.length - 1) {

        const koniec = scen && scen.wnioski && ['final', 'followup'].includes(scen.sceny[kroki[i].si].id);

  }
  function ustawGre(v) {
    gra = v;

  // ---------- przerwa: AI pracuje, lekarze wychodzą z pokoju i wracają z gotową wypowiedzią (Michał 1.11) ----------
  // Na żywo, gdy odtwarzanie dogoniło ostatnią wypowiedź, a werdyktu jeszcze nie ma: lekarze wychodzą przez drzwi
  // (konsylium czyta literaturę i pisze opinie), tablica pokazuje czas narady; nowa wypowiedź sprowadza ich z powrotem.
  let przerwa = false, przerwaOd = 0, przerwaTimer = null, przerwaZegar = null, aiPracuje = false, aiOd = 0;

  }

    document.querySelectorAll('.postac').forEach((el, n) => {
      const id = el.dataset.kto, m = MIEJSCA_AKT[id]; if (!WYCHODZA(id) || !m) return;
      el.getAnimations().forEach((a) => a.cancel());
      if (bezRuchu()) { el.style.opacity = 0; return; }
      const start = `translate(${m.x}px, ${m.y}px) scale(${m.s})`;
      const cel = `translate(${DRZWI.x + (n % 3 - 1) * 22}px, ${DRZWI.y}px) scale(${m.s * .62})`;
      el.animate([{ transform: start, opacity: 1 }, { transform: cel, opacity: 1, offset: .82 }, { transform: cel, opacity: 0 }],
        { duration: 2600 + Math.random() * 900, delay: 150 + n * 140, easing: 'ease-in-out', fill: 'forwards' });
    });
    rysujPrzerwe(); clearInterval(przerwaZegar); przerwaZegar = setInterval(rysujPrzerwe, 1000);
  }
  function rysujPrzerwe() {

    const t = mmss(Date.now() - przerwaOd);
    $('tablica').innerHTML = `<div class="gora"><span class="faza">Konsylium pracuje</span><span class="czas">${t}</span></div><p class="temat">Lekarze wyszli się naradzić: czytają literaturę i piszą opinie. Wrócą z gotową wypowiedzią.</p><div class="ai-kropki" aria-hidden="true"><i></i><i></i><i></i></div>`;
    $('napisy').innerHTML = `<span class="nap-temat"><b>AI pracuje · ${t}</b>Lekarze są poza pokojem; nowa wypowiedź pojawi się sama.</span>`;
    rysujChipAi();
  }
  function zakonczPrzerwe(potem) {
    clearTimeout(przerwaTimer); przerwaTimer = null; clearInterval(przerwaZegar); przerwaZegar = null;
    if (!przerwa) { if (potem) potem(); return; }
    przerwa = false; $('pokoj').classList.remove('przerwa');
    let najdluzej = 0;
    document.querySelectorAll('.postac').forEach((el, n) => {
      const id = el.dataset.kto, m = MIEJSCA_AKT[id]; if (!WYCHODZA(id) || !m) return;
      el.getAnimations().forEach((a) => a.cancel()); el.style.opacity = '';
      if (bezRuchu()) return;
      const start = `translate(${DRZWI.x + (n % 3 - 1) * 22}px, ${DRZWI.y}px) scale(${m.s * .62})`, cel = `translate(${m.x}px, ${m.y}px) scale(${m.s})`;
      const d = 2200 + Math.random() * 700, op = 100 + n * 110;
      el.animate([{ transform: start, opacity: 0 }, { transform: start, opacity: 1, offset: .15 }, { transform: cel, opacity: 1 }], { duration: d, delay: op, easing: 'ease-in-out', fill: 'none' });
      najdluzej = Math.max(najdluzej, d + op);
    });
    rysujChipAi();
    if (potem) setTimeout(potem, najdluzej);
  }
  // sygnał „AI pracuje” z powłoki (plik _ai-aktywnosc.json: hooki Claude Code albo skrypty dymek.py / wywiad_na_zywo.py)
  function ustawAi(aktywne, od) {
    const bylo = aiPracuje;
    aiPracuje = aktywne; if (aktywne && (!bylo || !aiOd)) aiOd = Number(od) || Date.now();

  async function zbierz(entry, sciezka, out) {
    if (entry.isFile) { out.push({ sciezka: sciezka + entry.name, plik: await new Promise((ok, zle) => entry.file(ok, zle)) }); return; }
    const czytnik = entry.createReader();
    let partia;
    do { partia = await new Promise((ok, zle) => czytnik.readEntries(ok, zle)); for (const e of partia) await zbierz(e, sciezka + entry.name + '/', out); } while (partia.length);
  }
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    const out = [];
    for (const it of [...(e.dataTransfer?.items || [])]) { const en = it.webkitGetAsEntry && it.webkitGetAsEntry(); if (en) await zbierz(en, '', out); }
    if (out.length) wczytajPliki(out);
  });

  // ---------- sterowanie ----------
  $('graj').addEventListener('click', () => ustawGre(!gra));
  $('wstecz').addEventListener('click', () => { pokaz(i - 1, true); });
  $('dalej').addEventListener('click', () => { pokaz(i + 1); });
  $('tempo').addEventListener('change', (e) => { tempo = +e.target.value; zaplanuj(); });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('select, input, textarea, button, [role="button"]')) return;
    if (e.key === ' ') { e.preventDefault(); ustawGre(!gra); }
    if (e.key === 'ArrowRight') pokaz(i + 1);
    if (e.key === 'ArrowLeft') pokaz(i - 1, true);
  });
  window.addEventListener('resize', () => { const d = document.querySelector('.dymek:not(.stary)'); if (d && kroki.length) ustawDymek(d, scen.sceny[kroki[i].si].wypowiedzi[kroki[i].wi].kto); });

  // motyw: domyślnie ciemny (jak woli Michał); zapamiętany lokalnie, jeśli się da
  function ustawMotyw(m) {
    const root = document.documentElement;
    root.setAttribute('data-motyw', m === 'jasny' ? 'jasny' : 'ciemny');
    root.setAttribute('data-theme', m === 'jasny' ? 'light' : 'dark');
    $('motyw').textContent = m === 'jasny' ? 'Tryb ciemny' : 'Tryb jasny';
    try { localStorage.setItem('pokoj-motyw', m); } catch { /* brak pamięci przeglądarki */ }
  }
  let motyw = null;
  try { motyw = localStorage.getItem('pokoj-motyw'); } catch { /* jw. */ }
  if (motyw && window.parent === window) ustawMotyw(motyw); // w aplikacji (iframe) motyw przychodzi z powłoki
  else $('motyw').textContent = matchMedia('(prefers-color-scheme: light)').matches ? 'Tryb ciemny' : 'Tryb jasny';
  $('motyw').addEventListener('click', () => {
    const teraz = document.documentElement.getAttribute('data-motyw') || (matchMedia('(prefers-color-scheme: light)').matches ? 'jasny' : 'ciemny');
    ustawMotyw(teraz === 'jasny' ? 'ciemny' : 'jasny');
  });

  // start: osadzona sprawa demonstracyjna — tylko poza aplikacją MS Konsylium (w aplikacji Pokój czyta folder Konsylium)
  function startDemo() {
    if (typeof DEMO !== 'undefined' && DEMO) {
      przygotuj(DEMO);
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => ustawGre(true), 1500);
      else ustawGre(false);
    }
  }
  gra = false; $('graj').textContent = '▶︎ Odtwarzaj'; $('graj').classList.remove('nk-on');
  if (window.MsMost) window.MsMost.dostepny().then((jest) => { if (!jest) startDemo(); }); else startDemo();
})();

</script>
