<!doctype html>
<html lang="pl" data-motyw="jasny">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Psychoterapia AI</title>
<style>
/*@@FONT@@*/
/*@@MS-TOKENY@@*/
/* Rozmowa: okno jak w komunikatorze. Jeden terapeuta AI odpowiada jednym głosem; za nim pracuje zespół
   agentów różnych podejść (docs/ROZMOWA.md). Makieta: grafika/psycholog/makieta-rozmowa.png (wątek Graficzny). */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 14.5px/1.5 'Plus Jakarta Sans Variable', 'Segoe UI', system-ui, sans-serif; color: var(--ink); background: transparent; overflow: hidden; }
.okno { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; padding: 18px 28px 16px 110px; gap: 10px; }
.naglowek { display: flex; align-items: center; gap: 14px; min-height: 52px; }
.awatar-glowny { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff;
  background: linear-gradient(150deg, #8f7fd6, #5B4A8A); box-shadow: 0 0 0 3px rgba(255,255,255,.75), 0 10px 22px -10px rgba(60,40,90,.7); position: relative; flex: none; }
.awatar-glowny::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: #5fbf8a; border: 2px solid #fff; }
.awatar-glowny.cisza::after { background: #b9b2c9; }
.naglowek h1 { margin: 0; font-size: 19px; font-weight: 760; letter-spacing: -.01em; }
.naglowek .sub { font-size: 12.5px; color: var(--mut); }
.naglowek .prawy { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 0; border-radius: 999px; padding: 8px 14px; font: 650 12.5px inherit; font-family: inherit; background: var(--btn); color: var(--btn-txt); cursor: pointer; }
.btn:hover { background: var(--btn-h); }
.btn.on { background: var(--on); color: var(--on-txt); }
select.btn { appearance: none; padding-right: 14px; max-width: 220px; }
.tryb { display: inline-flex; border-radius: 999px; background: var(--btn); padding: 3px; }
.tryb button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font: 650 12px inherit; font-family: inherit; color: var(--mut); cursor: pointer; }
.tryb button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 4px 12px -8px rgba(60,40,90,.6); }
.pracuje { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 14px; background: var(--panel); box-shadow: var(--panel-cien); font-size: 12.5px; color: var(--mut); min-height: 42px; transition: opacity .3s; }
.pracuje b { color: var(--ink); font-weight: 700; }
.pracuje.spi { opacity: .75; }
.kropki i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #a894d6; margin-right: 3px; animation: kr 1.3s ease-in-out infinite; }
.kursor { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: #7d63c2; animation: kursor .9s steps(1) infinite; }
@keyframes kursor { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .kursor { animation: none; } }
.kropki i:nth-child(2) { animation-delay: .2s; } .kropki i:nth-child(3) { animation-delay: .4s; }
.spi .kropki i { animation: none; opacity: .4; }
@keyframes kr { 50% { opacity: .25; transform: translateY(-3px); } }
.awatary { display: flex; margin-left: auto; padding-left: 10px; }
.aw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; margin-left: -8px; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; color: #fff; animation: wejdz .35s ease both; }
.aw.myśli { animation: wejdz .35s ease both, puls 1.6s ease-in-out infinite; }
@keyframes wejdz { from { transform: scale(.3); opacity: 0; } }
@keyframes puls { 50% { box-shadow: 0 0 0 4px rgba(168,148,214,.35); } }
.rozmowa { overflow-y: auto; padding: 8px 6px 18px; display: flex; flex-direction: column; gap: 16px; }
.dzien { align-self: center; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); padding: 4px 12px; border-radius: 999px; background: var(--btn); }
.msg { max-width: min(68%, 720px); padding: 12px 16px; border-radius: 20px; position: relative; animation: msg .35s cubic-bezier(.2,.9,.3,1) both; white-space: pre-wrap; overflow-wrap: anywhere; }
@keyframes msg { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.msg .kto { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 3px; white-space: normal; }
.msg.zespol { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 6px; box-shadow: var(--panel-cien); }
.msg.zespol .kto { color: #6a58a8; }
html[data-motyw="ciemny"] .msg.zespol .kto { color: #cdb9f0; }
.msg.ja { align-self: flex-end; background: linear-gradient(150deg, #8f7fd6, #5B4A8A); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 14px 28px -18px rgba(60,40,90,.8); }
.msg.ja .kto { color: #e9defc; }
.msg .czas { position: absolute; bottom: -17px; font-size: 10.5px; color: var(--mut); white-space: nowrap; }
.msg.ja .czas { right: 8px; } .msg.zespol .czas { left: 8px; }
.msg .stan-wys { margin-left: 4px; }
.msg .emo { position: absolute; bottom: -12px; right: 12px; background: #fff; color: #222; border-radius: 999px; padding: 1px 7px; font-size: 13px; box-shadow: 0 2px 8px rgba(60,40,90,.25); white-space: nowrap; }
.msg.zespol .emo { right: auto; left: 64px; }
.msg .reaguj { position: absolute; top: -14px; right: -6px; display: none; gap: 2px; background: var(--panel); border-radius: 999px; padding: 2px 4px; box-shadow: 0 6px 16px -8px rgba(60,40,90,.6); white-space: nowrap; }
.msg.zespol:hover .reaguj, .msg.zespol:focus-within .reaguj { display: flex; }
.reaguj button { border: 0; background: transparent; font-size: 15px; cursor: pointer; border-radius: 50%; width: 28px; height: 28px; }
.reaguj button:hover { background: var(--btn); transform: scale(1.15); }
.msg .zrodla { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; white-space: normal; }
.msg .zrodla span { font-size: 10.5px; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--btn); color: var(--btn-txt); }
.msg .glosy-btn { margin-top: 8px; border: 0; background: none; color: var(--mut); font: 650 11.5px inherit; font-family: inherit; cursor: pointer; padding: 0; text-decoration: underline dotted; }
.msg .glosy { margin-top: 8px; display: grid; gap: 6px; white-space: normal; }
.msg .glos { font-size: 12.5px; padding: 7px 10px; border-radius: 12px; background: var(--btn); border-left: 3px solid var(--k, #8f7fd6); }
.msg .glos b { display: block; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--mut); }
.msg.pisze { color: var(--mut); font-style: italic; display: flex; gap: 8px; align-items: center; }
.msg.system { align-self: center; max-width: min(82%, 760px); background: var(--btn); color: var(--ink); font-size: 12.5px; border-radius: 16px; text-align: left; box-shadow: none; }
.msg.system b { font-weight: 750; }
.msg.kryzys { align-self: stretch; max-width: none; background: #fff4f4; color: #5a1d1d; border: 2px solid #d9534f; border-radius: 18px; box-shadow: 0 16px 36px -22px rgba(168,58,56,.8); }
html[data-motyw="ciemny"] .msg.kryzys { background: #3a1c22; color: #ffe1e1; }
.msg.kryzys .kto { color: #b52b27; }
.msg.kryzys ul { margin: 8px 0 4px; padding: 0; list-style: none; display: grid; gap: 6px; white-space: normal; }
.msg.kryzys li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.msg.kryzys li .nr { font-size: 19px; font-weight: 800; color: #b52b27; min-width: 120px; }
html[data-motyw="ciemny"] .msg.kryzys li .nr { color: #ff8f8a; }
.msg.kryzys li small { color: inherit; opacity: .8; }
.wpis { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end; padding-top: 10px; border-top: 1px solid var(--pole-obrys); }
.pole { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 8px 16px; border-radius: 24px; background: var(--pole); box-shadow: inset 0 0 0 1px var(--pole-obrys); }
.pole textarea { border: 0; outline: 0; resize: none; background: transparent; font: inherit; color: var(--ink); max-height: 140px; min-height: 24px; padding: 4px 0; }
.emoji { display: flex; gap: 2px; flex-wrap: wrap; }
.emoji button { border: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: transparent; font-size: 17px; cursor: pointer; transition: transform .15s; }
.emoji button:hover { background: var(--btn); transform: scale(1.18); }
.wyslij { width: 46px; height: 46px; border-radius: 50%; border: 0; background: linear-gradient(150deg, #8f7fd6, #5B4A8A); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 22px -12px rgba(91,74,138,.9); }
.wyslij:disabled { opacity: .45; cursor: default; }
.wyslij svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.zwolaj { border: 0; border-radius: 999px; padding: 13px 18px; font: 750 13px inherit; font-family: inherit; background: var(--on); color: var(--on-txt); display: flex; gap: 8px; align-items: center; cursor: pointer; box-shadow: 0 10px 24px -12px rgba(91,74,138,.8); white-space: nowrap; }
.stopka { font-size: 11px; color: var(--mut); text-align: center; }
.stopka b { color: var(--ink); }
.panel-boczny { position: absolute; right: 24px; top: 84px; width: min(420px, 40vw); max-height: calc(100% - 180px); overflow: auto; padding: 16px 18px; border-radius: 22px; background: var(--panel); box-shadow: var(--panel-cien), 0 30px 60px -30px rgba(60,40,90,.6); z-index: 5; white-space: pre-wrap; font-size: 13px; }
.panel-boczny h3 { margin: 0 0 8px; font-size: 14px; }
/* konta lokalne (decyzja Michała 1.11.2026 15:42): pseudonim + wiek + płeć, opcjonalny PIN; pamięć rozmów na dysku */
.konta-tlo { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(240,236,248,.55); backdrop-filter: blur(6px); }
[data-motyw="ciemny"] .konta-tlo { background: rgba(20,16,30,.55); }
.konta { width: min(440px, 92vw); max-height: 88%; overflow: auto; padding: 22px 24px; border-radius: 26px; background: var(--panel); box-shadow: var(--panel-cien), 0 30px 60px -30px rgba(60,40,90,.6); font-size: 13.5px; }
.konta h2 { margin: 0 0 4px; font-size: 18px; } .konta p { margin: 4px 0 12px; color: var(--mut); }
.konta .kto-lista { display: grid; gap: 8px; margin-bottom: 14px; }
.konta .kto-lista button { text-align: left; border: 0; border-radius: 16px; padding: 10px 14px; background: var(--btn); color: var(--ink); font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.konta .kto-lista button:hover { background: var(--btn-h); }
.konta .kto-lista .aw { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; background: linear-gradient(150deg, #8f7fd6, #5B4A8A); flex: none; }
.konta label { display: block; margin: 8px 0 3px; font-weight: 650; font-size: 12.5px; }
.konta input, .konta select { width: 100%; border: 1px solid var(--btn-h); border-radius: 12px; padding: 8px 10px; font: inherit; background: var(--bg, #fff); color: var(--ink); }
.konta .rzad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.konta .akcje { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.konta .blad { color: #b5475c; min-height: 1.2em; margin: 6px 0 0; font-size: 12.5px; }
.msg.zespol.wstepna { opacity: .97; }
.potw { align-self: center; display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 16px; background: var(--panel); box-shadow: var(--panel-cien); font-size: 13px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 900px) { .okno { padding-left: 24px; } .msg { max-width: 88%; } .wpis { grid-template-columns: 1fr auto; } .zwolaj { grid-column: 1 / -1; justify-content: center; } }
  .msg.kryzys small.nie-terapia{display:block;margin-top:8px;font-style:italic;opacity:.8}
</style>
</head>
<body>
<div class="okno">
  <header class="naglowek">
    <div class="awatar-glowny cisza" id="awatar" aria-hidden="true">AI</div>
    <div>
      <h1>Psychoterapeuta AI</h1>
      <div class="sub" id="sub">jeden głos · w tle zespół terapeutów różnych podejść</div>
    </div>
    <div class="prawy">
      <div class="tryb" role="group" aria-label="Rodzaj rozmowy">
        <button type="button" data-tryb="rozmowa" aria-pressed="true" title="Mówisz o sobie albo o konkretnej sytuacji – terapeuta odpowiada Tobie">O mojej sytuacji</button>
        <button type="button" data-tryb="konsultacja" aria-pressed="false" title="Opisujesz przypadek jako terapeuta – zespół odpowiada jak kolega po fachu">Konsultacja przypadku</button>
      </div>
      <button class="btn" type="button" id="konto-btn" hidden title="Twoje konto – zmień albo dodaj">👤 <span id="konto-nazwa"></span></button>
      <button class="btn" type="button" id="pamiec-btn" hidden title="Co psychoterapeuta pamięta z wcześniejszych rozmów">Co pamiętam</button>
      <select class="btn" id="lista" aria-label="Wcześniejsze rozmowy" hidden></select>
      <button class="btn" type="button" id="formulacja-btn" hidden>Jak to rozumiemy</button>
      <button class="btn" type="button" id="nowa">Nowa rozmowa</button>
    </div>
  </header>
  <div class="pracuje spi" id="pracuje" aria-live="polite"><span class="kropki" aria-hidden="true"><i></i><i></i><i></i></span><span id="pracuje-tekst">Zespół czeka na Twoją wiadomość</span><div class="awatary" id="awatary"></div></div>
  <div class="rozmowa" id="rozmowa" aria-live="polite"></div>
  <div>
    <form class="wpis" id="wpis" autocomplete="off">
      <div class="pole">
        <textarea id="tekst" rows="1" maxlength="4000" placeholder="Napisz, co się dzieje albo o jaką sytuację chcesz zapytać… (Enter wysyła, Shift+Enter – nowa linia)"></textarea>
        <div class="emoji" id="emoji" aria-label="Emotikony"></div>
      </div>
      <button class="wyslij" id="wyslij" type="submit" aria-label="Wyślij" disabled><svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="zwolaj" id="zwolaj" type="button" title="Cały zespół omawia tę rozmowę w Pokoju psychologicznym i pisze Wnioski">Zwołaj konsylium <span aria-hidden="true">→</span></button>
    </form>
    <p class="stopka">Psychoterapia AI – narzędzie testowe marki MS, nie zastępuje psychoterapeuty · w kryzysie <b>112</b> · <b>800 70 2222</b></p>
  </div>
  <div class="panel-boczny" id="formulacja" hidden></div>
  <div class="konta-tlo" id="konta" hidden><div class="konta" id="konta-okno"></div></div>
</div>
<script>

</script>
<script>
var POMOC = /*@@POMOC@@*/null;
var FRAZY = /*@@FRAZY@@*/null;
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ROLE = {
    prowadzacy: ['Prowadzący · superwizor', 'PS', '#6b5f96'], terapeuta_cbt: ['Terapeutka CBT', 'CBT', '#7b6cc4'],
    terapeuta_psychodynamiczny: ['Terapeuta psychodynamiczny', 'PD', '#7fa07a'], terapeuta_systemowy: ['Terapeutka systemowa', 'TS', '#c9a65c'],
    terapeuta_act: ['Terapeuta ACT / trzecia fala', 'ACT', '#6f96a9'], terapeuta_humanistyczny: ['Terapeutka humanistyczna', 'TH', '#b97a6c'],
    diagnosta: ['Diagnosta kliniczny', 'DK', '#4f7f8a'], psychiatra: ['Psychiatra konsultant', 'PK', '#a0741f'],
    straznik_ryzyka: ['Strażnik ryzyka', 'SR', '#c0504d'], klient_sedzia: ['Klient jako sędzia', 'KS', '#9780bb'],
    sprawdzajacy_etyki: ['Sprawdzający etyki', 'SE', '#8a7fb5'], sprawdzajacy_zrodel: ['Sprawdzający źródeł', 'SŹ', '#5b8a6a'],
    rzecznik_normalnosci: ['Rzecznik normalności', 'RN', '#7a8a9a']
  };
  function rola(r) { r = String(r || '').toLowerCase().replace(/[-\s]+/g, '_'); return ROLE[r] || [r || 'Zespół', (r || '?').slice(0, 2).toUpperCase(), '#8f7fd6']; }
  var EMOJI = ['🙂', '😊', '😔', '😢', '😟', '😤', '🤔', '👍', '❤️', '🙏', '💪', '🌱'];
  var REAKCJE = ['❤️', '👍', '🙏', '🤔', '😊'];

  var most = typeof MsMost !== 'undefined' ? MsMost : null;
  var stan = { id: null, tryb: 'rozmowa', ja: [], zespol: [], reakcje: {}, pracuje: null, aiAktywne: false, aiBylo: 0, ostatniaWys: 0, demo: false, sprawa: null, konto: null };
  var pliki = false;

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function md(t) { return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*([^*\n]+)\*/g, '$1<i>$2</i>'); }
  function godz(ts) { var d = new Date(ts || Date.now()); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function bezOgonkow(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l'); }
  // Filtr słownikowy w aplikacji – działa zanim cokolwiek trafi do modelu (docs/BEZPIECZENSTWO.md §3)
  function ryzykoLokalne(t) {
    var s = bezOgonkow(t), w = { poziom: 0, frazy: [] };
    // decyzja Michała 1.11.2026: wyraźne zaprzeczenie („nie mam myśli samobójczych”) nie podnosi poziomu
    ((FRAZY && FRAZY.zaprzeczenia) || []).forEach(function (re) { s = s.replace(new RegExp(re, 'g'), ' '); });
    ((FRAZY && FRAZY.poziom3) || []).forEach(function (re) { var m = new RegExp(re).exec(s); if (m) { w.poziom = 3; w.frazy.push(m[0]); } });
    ((FRAZY && FRAZY.przemoc) || []).forEach(function (re) { var m = new RegExp(re).exec(s); if (m) { w.poziom = 3; w.przemoc = true; w.frazy.push(m[0]); } });
    if (!w.poziom) ((FRAZY && FRAZY.poziom2) || []).forEach(function (re) { var m = new RegExp(re).exec(s); if (m) { w.poziom = 2; w.frazy.push(m[0]); } });
    if (!w.poziom) ((FRAZY && FRAZY.poziom1) || []).forEach(function (re) { var m = new RegExp(re).exec(s); if (m) { w.poziom = Math.max(w.poziom, 1); w.frazy.push(m[0]); } });
    return w;
  }
  function numeryHtml(pierwsze) {
    var lista = ((POMOC && POMOC.numery) || []).slice();
    if (pierwsze) lista = lista.filter(function (n) { return pierwsze.indexOf(n.numer) >= 0; }).concat(lista.filter(function (n) { return pierwsze.indexOf(n.numer) < 0; }));
    return '<ul>' + lista.map(function (n) {
      return '<li><span class="nr">' + esc(n.numer) + '</span><span><b>' + esc(n.nazwa) + '</b><br><small>' + esc(n.kiedy) + ' · ' + esc(n.godziny) + '</small></span></li>';
    }).join('') + '</ul>' + (POMOC && POMOC.bez_skierowania ? '<small>' + esc(POMOC.bez_skierowania) + '</small>' : '');
  }

  // ---------- pliki rozmowy (docs/ROZMOWA.md) ----------
  function kat() { return 'rozmowy/' + stan.id; }
  function nowyId() { var d = new Date(); var p = function (x) { return ('0' + x).slice(-2); }; return (stan.konto ? stan.konto.konto + '-' : '') + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 5); }
  function zapiszJa() {
    if (!pliki || stan.demo) return Promise.resolve();
    var dane = { rozmowa: stan.id, tryb: stan.tryb, zmieniono: new Date().toISOString(), wiadomosci: stan.ja, reakcje: stan.reakcje };
    return most.zapisz(kat() + '/uzytkownik.json', JSON.stringify(dane, null, 2));
  }
  function zapiszMeta() {
    if (!pliki || stan.demo) return Promise.resolve();
    return most.zapisz(kat() + '/meta.json', JSON.stringify({ rozmowa: stan.id, konto: stan.konto ? stan.konto.konto : undefined, tryb: stan.tryb, utworzono: stan.utworzono, aplikacja: 'MS Konsylium Psychologiczne' }, null, 2));
  }

  // ---------- pisanie na żywo (Michał 1.11.2026 07:48): gotowa odpowiedź pojawia się słowo po słowie ----------
  var pisanie = null, kolejkaPisania = [];
