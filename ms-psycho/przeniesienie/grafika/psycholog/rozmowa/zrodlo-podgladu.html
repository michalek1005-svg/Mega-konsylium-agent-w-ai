<!doctype html><html lang="pl" data-motyw="jasny"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:">
<title>Rozmowa – podgląd</title>
<style>
@font-face{font-family:'Plus Jakarta Sans Variable';font-weight:200 800;src:url(data:font/woff2;base64,@@F1@@) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:'Plus Jakarta Sans Variable';font-weight:200 800;src:url(data:font/woff2;base64,@@F2@@) format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}
@@CSS@@
html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans Variable','Segoe UI',system-ui,sans-serif;background:radial-gradient(46vw 42vh at 100% -4%,rgba(150,130,200,.5),transparent 70%),radial-gradient(50vw 46vh at -4% 104%,rgba(170,190,140,.45),transparent 70%),linear-gradient(160deg,#F1EEF5,#DDD6E6)}
:root[data-motyw="ciemny"] body{background:radial-gradient(46vw 42vh at 100% -4%,rgba(120,100,180,.35),transparent 70%),linear-gradient(160deg,#1b1828,#120f1c)}
.app{display:grid;grid-template-columns:72px 1fr;gap:18px;padding:18px;height:100vh;box-sizing:border-box}
.pasek{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0;border-radius:36px;background:rgba(255,255,255,.44);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5),0 30px 60px -34px rgba(60,40,90,.5)}
:root[data-motyw="ciemny"] .pasek{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;background:linear-gradient(150deg,#7b6cc4,#5B4A8A);box-shadow:0 0 18px rgba(195,180,230,.9),0 0 36px rgba(138,127,181,.5)}
.ik{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(91,74,138,.08);color:#5B4A8A;border:0;cursor:pointer}
.ik.on{background:#5B4A8A;color:#fff}
.ik svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#rozmowa{min-height:0}
</style></head><body>
<div class="app">
 <nav class="pasek" aria-label="Widoki">
  <div class="logo">K</div>
  <button class="ik" title="Wywiad"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
  <button class="ik on" title="Rozmowa"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
  <button class="ik" title="Pokój psychologiczny"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-4 3-6 6-6s6 2 6 6M12 20c0-4 2-6 4-6s6 2 6 6"/></svg></button>
  <button class="ik" id="motyw" title="Tryb jasny/ciemny"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></button>
 </nav>
 <main id="rozmowa"></main>
</div>
<script>@@JS@@</script>
<script>
// DEMO (dane fikcyjne, dorosły, tylko wiek i płeć) – w aplikacji tury przychodzą z rozmowa.jsonl
const rz = Rozmowa.zamontuj(document.getElementById('rozmowa'), {
  imie: 'Terapeutka', sprawa: 'K34 · demo',
  przyciski: [['Formulacja robocza', () => {}], ['Wnioski', () => {}]],
  onZwolaj: () => rz.dodaj({ kto: 'system', tekst: 'Konsylium zwołane – przejdź do Pokoju psychologicznego.' }),
  onWyslij: () => { rz.pisze(true, ['Terapeutka CBT', 'Terapeuta ACT', 'Strażnik ryzyka']); setTimeout(() => { rz.pisze(false); rz.dodaj({ kto: 'terapeuta', tekst: 'Rozumiem. To brzmi jak sytuacja, w której łatwo wziąć całą winę na siebie. Spróbujmy na chwilę rozdzielić to, co zależało od Pani, od tego, co nie zależało. 🙂' }); }, 2600); },
});
rz.dodaj({ kto: 'system', dzien: 'Dziś', tekst: 'Rozmowa testowa · kobieta, 34 lata · dane fikcyjne' });
rz.dodaj({ kto: 'terapeuta', czas: '20:14', tekst: 'Dobry wieczór 🙂 Jestem tu, żeby porozmawiać. Może Pani zacząć od czegokolwiek: od jednej konkretnej sytuacji, która dziś Panią poruszyła, albo od tego, jak się Pani teraz czuje.' });
rz.dodaj({ kto: 'ja', czas: '20:16', tekst: 'Szefowa skrytykowała mój raport przy całym zespole. Od tamtej pory nie mogę przestać o tym myśleć i mam wrażenie, że wszyscy uważają mnie za niekompetentną.' });
rz.dodaj({ kto: 'terapeuta', czas: '20:17', emo: ['❤️'], tekst: 'To musiało być bardzo przykre, zwłaszcza że wydarzyło się przy innych. Słyszę w tym dwie rzeczy: sam fakt krytyki i myśl, że „wszyscy uważają mnie za niekompetentną”. Ta druga często boli bardziej niż pierwsza.\n\nCzy pamięta Pani, co dokładnie powiedziała szefowa – słowo w słowo?',
  zrodla: ['restrukturyzacja poznawcza', 'walidacja emocji'],
  kulisy: [{ rola: 'CBT', skrot: 'Uogólnienie („wszyscy”) i czytanie w myślach – warto oddzielić fakt od interpretacji.' }, { rola: 'ACT', skrot: 'Najpierw zauważyć myśl jako myśl, bez walki z nią.' }, { rola: 'Psychodynamiczny', skrot: 'Może poruszać wcześniejsze doświadczenia oceniania – nie teraz, za wcześnie.', spor: true }, { rola: 'Strażnik ryzyka', skrot: 'Brak sygnałów ryzyka. Poziom 0.' }] });
rz.dodaj({ kto: 'ja', czas: '20:19', tekst: 'Powiedziała, że „wnioski są niedopracowane i trzeba to poprawić do piątku”. 🤔' });
rz.pisze(true, ['Terapeutka CBT', 'Terapeuta ACT', 'Psychodynamiczny', 'Systemowy', 'Strażnik ryzyka']);
document.getElementById('motyw').onclick = () => { const r = document.documentElement; r.dataset.motyw = r.dataset.motyw === 'ciemny' ? 'jasny' : 'ciemny'; };
</script></body></html>
