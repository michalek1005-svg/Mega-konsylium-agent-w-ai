<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Dla Halusi</title>
<style>
:root{--akcent:#8A7FB5;--font:'Plus Jakarta Sans Variable','Segoe UI',system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font)}
#prezent{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;cursor:pointer;
 background:radial-gradient(700px 460px at 100% -4%,rgba(150,130,200,.5),transparent 70%),radial-gradient(600px 400px at 0% 104%,rgba(240,170,180,.5),transparent 70%),linear-gradient(#F1EEF5,#DDD6E6)}
.tafla{position:absolute;inset:22px;border-radius:34px;background:rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.5),0 40px 74px -34px rgba(60,40,90,.5)}
.pud{position:relative;width:min(46vmin,420px);aspect-ratio:1/1;animation:kolys 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes kolys{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-10px)}}
.pud svg{width:100%;height:100%;overflow:visible}
.podpis{position:absolute;bottom:9vh;left:0;right:0;text-align:center;color:#5b4a8a;font-weight:700;font-size:clamp(14px,2vmin,22px);letter-spacing:.06em;text-transform:uppercase;opacity:.85;animation:mig 1.6s ease-in-out infinite}
@keyframes mig{50%{opacity:.35}}
.blysk{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 16px 6px #fff8c8;animation:blysk 2.2s ease-in-out infinite}
@keyframes blysk{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
/* faza 2: otwarcie */
#prezent.otwarty{cursor:default}
#prezent.otwarty .pud{animation:none}
#prezent.otwarty .wieko{animation:wieko 1.1s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes wieko{to{transform:translate(-40px,-260px) rotate(-28deg);opacity:0}}
#prezent.otwarty .korpus{animation:korpus .9s 6.4s ease forwards}
@keyframes korpus{to{transform:translateY(80px) scale(.6);opacity:0}}
#prezent.otwarty .podpis{opacity:0;animation:none}

/* kolaż zrzutów wylatujących z prezentu */
.kolaz{position:absolute;inset:0;pointer-events:none}
.zrzut{position:absolute;left:50%;top:60%;width:min(34vw,420px);padding:8px 8px 22px;background:#fff;border-radius:10px;box-shadow:0 20px 50px -18px rgba(60,40,90,.55),inset 0 0 0 1px rgba(255,255,255,.7);opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(0deg);transform-origin:50% 50%}
.zrzut img{display:block;width:100%;border-radius:6px}
.zrzut i{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A7FB5}
#prezent.otwarty .zrzut{animation:wylot 2.6s var(--d) cubic-bezier(.2,.9,.3,1) forwards}
@keyframes wylot{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(0)}18%{opacity:1}55%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--k))}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) - 6vh)) scale(1.04) rotate(var(--k))}}
.napis{position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:800;font-size:clamp(44px,9vmin,120px);color:#c0294b;letter-spacing:-.02em;opacity:0;transform:scale(.4);text-shadow:0 10px 40px rgba(192,41,75,.25)}
#prezent.otwarty 
/* kolaż zrzutów wylatujących z prezentu */
.kolaz{position:absolute;inset:0;pointer-events:none}
.zrzut{position:absolute;left:50%;top:60%;width:min(34vw,420px);padding:8px 8px 22px;background:#fff;border-radius:10px;box-shadow:0 20px 50px -18px rgba(60,40,90,.55),inset 0 0 0 1px rgba(255,255,255,.7);opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(0deg);transform-origin:50% 50%}
.zrzut img{display:block;width:100%;border-radius:6px}
.zrzut i{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A7FB5}
#prezent.otwarty .zrzut{animation:wylot 2.6s var(--d) cubic-bezier(.2,.9,.3,1) forwards}
@keyframes wylot{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(0)}18%{opacity:1}55%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--k))}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) - 6vh)) scale(1.04) rotate(var(--k))}}
#prezent.otwarty .napis{animation:napis 1.2s 7.2s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes napis{to{opacity:1;transform:scale(1)}}
.napis small{display:block;font-size:.26em;font-weight:600;color:#5b4a8a;letter-spacing:.14em;text-transform:uppercase;margin-top:.5em}
.serca{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.serce{position:absolute;bottom:-12vh;font-size:var(--r);opacity:0;animation:lec var(--t) var(--d) ease-in forwards;color:#e0526f;filter:drop-shadow(0 6px 10px rgba(192,41,75,.25))}
@keyframes lec{0%{opacity:0;transform:translateY(0) rotate(-10deg)}10%{opacity:1}100%{opacity:0;transform:translateY(-120vh) rotate(14deg)}}
#prezent.koniec{animation:znikaj 1s ease forwards}
@keyframes znikaj{to{opacity:0;visibility:hidden}}
.app{position:fixed;inset:0;display:grid;place-items:center;color:#5b4a8a;font-weight:700;font-size:28px;background:#F1EEF5}
</style></head><body>
